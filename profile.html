<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Profile — LinkSocial</title>
    <meta name="description" content="View profile on LinkSocial">
    <meta name="theme-color" content="#6c47ff">
    <meta property="og:title" content="Profile — LinkSocial">
    <meta property="og:image" content="src/og-image.png">
    <link rel="icon" type="image/png" href="src/og-image.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        :root{--font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Roboto,'Helvetica Neue',Arial,sans-serif;--transition-fast:150ms cubic-bezier(0.4,0,0.2,1);--transition-base:250ms cubic-bezier(0.4,0,0.2,1);--radius-sm:0.375rem;--radius-md:0.5rem;--radius-lg:0.75rem;--radius-xl:1rem;--radius-2xl:1.5rem;--radius-full:9999px}
        .theme-light{--bg-main:#f4f2ee;--bg-surface:#ffffff;--bg-hover:#f9fafb;--bg-input:#eef3f8;--border:#e5e7eb;--border-light:#f0f0f0;--text-primary:#191919;--text-secondary:#595856;--text-tertiary:#868482;--primary:#6c47ff;--primary-hover:#5835e8;--primary-light:#f0ebff;--secondary:#3b82f6;--success:#057642;--success-bg:#e9f7ef;--warning:#b85c00;--danger:#d11124;--danger-bg:#fdecea;--card-shadow:0 0 0 1px rgba(0,0,0,0.05);--shadow-lg:0 10px 25px rgba(0,0,0,0.08);--logo-url:url('https://i.ibb.co/Z67LrCG7/L-1.png')}
        .theme-dark{--bg-main:#1a1a2e;--bg-surface:#16213e;--bg-hover:#1a2744;--bg-input:#0f3460;--border:#2a3a5e;--border-light:#1e2d4a;--text-primary:#e8e8e8;--text-secondary:#b0b0b0;--text-tertiary:#8a8a8a;--primary:#8b6cff;--primary-hover:#7b5ce8;--primary-light:#1e1a3a;--secondary:#60a5fa;--success:#22c55e;--success-bg:#0a2a1a;--warning:#f59e0b;--danger:#ef4444;--danger-bg:#2a0a0a;--card-shadow:0 0 0 1px rgba(255,255,255,0.05);--shadow-lg:0 10px 25px rgba(0,0,0,0.3);--logo-url:url('https://i.ibb.co/jPxVQH4X/L-2.png')}
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;scroll-behavior:smooth}
        body{font-family:var(--font-family);background:var(--bg-main);color:var(--text-primary);line-height:1.5;min-height:100vh;transition:background var(--transition-base),color var(--transition-base)}

        @keyframes fadeInUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

        .navbar{position:sticky;top:0;z-index:100;background:var(--bg-surface);border-bottom:1px solid var(--border);height:52px;display:flex;align-items:center;padding:0 1.5rem;box-shadow:0 0 0 1px rgba(0,0,0,0.04)}
        .navbar-inner{max-width:1128px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between;gap:1rem}
        .navbar-brand{display:flex;align-items:center;gap:0.5rem;cursor:pointer;text-decoration:none;color:inherit}
        .navbar-logo{width:34px;height:34px;background-image:var(--logo-url);background-size:contain;background-repeat:no-repeat;background-position:center;border-radius:var(--radius-sm);flex-shrink:0}
        .navbar-title{font-size:1.125rem;font-weight:600;letter-spacing:-0.2px}
        .navbar-actions{display:flex;align-items:center;gap:0.5rem}

        .btn{display:inline-flex;align-items:center;justify-content:center;gap:0.3rem;padding:0.5rem 1rem;border-radius:var(--radius-full);font-weight:600;font-size:0.875rem;transition:all var(--transition-fast);cursor:pointer;font-family:var(--font-family);border:none;white-space:nowrap}
        .btn:active{transform:scale(0.97)}
        .btn-primary{background:var(--primary);color:#fff;box-shadow:0 0 0 1px rgba(0,0,0,0.08),0 1px 2px rgba(0,0,0,0.06)}
        .btn-primary:hover{background:var(--primary-hover)}
        .btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary);font-weight:600}
        .btn-outline:hover{background:var(--primary-light)}
        .btn-ghost{background:transparent;color:var(--text-secondary);font-weight:500}
        .btn-ghost:hover{background:var(--bg-hover);color:var(--text-primary)}
        .btn-sm{padding:0.3rem 0.85rem;font-size:0.8125rem}
        .btn-icon{width:36px;height:36px;padding:0;border-radius:var(--radius-full)}

        .container{max-width:900px;margin:0 auto;padding:0 1rem 3rem}

        /* Profile Cover & Avatar - Fixed positioning */
        .profile-cover{height:160px;background:linear-gradient(135deg,var(--primary),var(--secondary));border-radius:0 0 var(--radius-2xl) var(--radius-2xl);position:relative;margin-bottom:56px;animation:fadeIn 0.5s ease-out}
        .profile-avatar-wrap{position:absolute;bottom:-48px;left:2rem;width:96px;height:96px;border-radius:var(--radius-full);border:4px solid var(--bg-surface);background:var(--bg-surface);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,0.1);z-index:2}
        .profile-avatar{width:84px;height:84px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:2.2rem;color:#fff;overflow:hidden}

        .profile-info{padding-top:0.5rem;animation:fadeInUp 0.4s ease-out}
        .profile-name-row{display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap}
        .profile-name{font-size:1.5rem;font-weight:800;letter-spacing:-0.3px}
        .profile-username{font-size:0.95rem;color:var(--text-tertiary);font-weight:500}
        .profile-bio{font-size:0.9rem;color:var(--text-secondary);margin:0.5rem 0;line-height:1.5}
        .profile-meta{display:flex;gap:1rem;flex-wrap:wrap;font-size:0.8rem;color:var(--text-tertiary);margin:0.5rem 0}
        .profile-meta-item{display:flex;align-items:center;gap:0.35rem}
        .profile-actions{display:flex;gap:0.5rem;margin-top:0.75rem;flex-wrap:wrap}

        .trust-badge-sm{display:inline-flex;align-items:center;gap:0.2rem;padding:0.2rem 0.5rem;border-radius:var(--radius-full);font-size:0.65rem;font-weight:700}
        .trust-badge-sm.high{background:var(--success-bg);color:var(--success)}
        .trust-badge-sm.medium{background:var(--warning-bg);color:var(--warning)}
        .trust-badge-sm.low{background:var(--danger-bg);color:var(--danger)}

        .stats-bar{display:flex;gap:0;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-xl);margin:1.5rem 0;overflow:hidden;box-shadow:var(--card-shadow);animation:fadeInUp 0.4s ease-out 0.1s both}
        .stat-item{flex:1;text-align:center;padding:1rem 0.5rem;cursor:pointer;transition:all var(--transition-fast);border-right:1px solid var(--border-light);background:transparent;font-family:var(--font-family)}
        .stat-item:last-child{border-right:none}
        .stat-item:hover{background:var(--bg-hover)}
        .stat-item.active{background:var(--primary-light)}
        .stat-item.active .stat-value,.stat-item.active .stat-label{color:var(--primary)}
        .stat-value{font-size:1.25rem;font-weight:800;color:var(--text-primary)}
        .stat-label{font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-tertiary);margin-top:0.15rem}

        .tab-content{animation:fadeInUp 0.3s ease-out}

        .link-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem;margin-bottom:0.5rem;box-shadow:var(--card-shadow);transition:all var(--transition-fast);display:flex;gap:0.75rem;cursor:pointer}
        .link-card:hover{box-shadow:var(--shadow-lg)}
        .link-card-screenshot{width:120px;height:80px;border-radius:var(--radius-md);overflow:hidden;flex-shrink:0;background:var(--bg-hover);border:1px solid var(--border-light)}
        .link-card-screenshot img{width:100%;height:100%;object-fit:cover}
        .link-card-screenshot .no-img{display:flex;align-items:center;justify-content:center;height:100%;font-size:1.5rem;color:var(--text-tertiary)}
        .link-card-info{flex:1;min-width:0}
        .link-card-title{font-weight:600;font-size:0.9rem;margin-bottom:0.2rem;line-height:1.3}
        .link-card-title:hover{color:var(--primary)}
        .link-card-desc{font-size:0.78rem;color:var(--text-secondary);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .link-card-stats{display:flex;gap:0.75rem;font-size:0.72rem;color:var(--text-tertiary);margin-top:0.35rem;flex-wrap:wrap}
        .link-card-stat{display:flex;align-items:center;gap:0.2rem}

        .person-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem;margin-bottom:0.5rem;box-shadow:var(--card-shadow);display:flex;align-items:center;gap:0.75rem;cursor:pointer;transition:all var(--transition-fast)}
        .person-card:hover{box-shadow:var(--shadow-lg)}
        .person-avatar{width:48px;height:48px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:1rem;flex-shrink:0}
        .person-name{font-weight:600;font-size:0.9rem}.person-username{font-size:0.75rem;color:var(--text-tertiary)}

        .side-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:1.25rem;box-shadow:var(--card-shadow);animation:fadeInUp 0.4s ease-out 0.2s both}
        .side-card-title{font-size:0.8rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-tertiary);margin-bottom:0.75rem}

        .empty-state{text-align:center;padding:2.5rem 1rem;color:var(--text-tertiary)}
        .empty-state-icon{font-size:2.5rem;margin-bottom:0.5rem;opacity:0.5}
        .empty-state-title{font-weight:600;font-size:1rem;margin-bottom:0.25rem}
        .loading-spinner{display:flex;align-items:center;justify-content:center;padding:3rem}
        .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 0.7s linear infinite}

        .toast-container{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:0.5rem;pointer-events:none}
        .toast{padding:0.75rem 1.25rem;border-radius:var(--radius-md);font-size:0.8125rem;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.15);animation:slideIn 0.3s ease-out;pointer-events:all}
        .toast.success{background:var(--success);color:#fff}.toast.error{background:var(--danger);color:#fff}.toast.info{background:var(--primary);color:#fff}

        @media(max-width:768px){
            .profile-cover{height:120px;margin-bottom:44px}
            .profile-avatar-wrap{left:1rem;width:76px;height:76px;bottom:-38px}
            .profile-avatar{width:66px;height:66px;font-size:1.6rem}
            .profile-name{font-size:1.25rem}
            .stat-item{padding:0.75rem 0.25rem}.stat-value{font-size:1rem}
        }
    </style>
</head>
<body class="theme-light">
    <nav class="navbar">
        <div class="navbar-inner">
            <a class="navbar-brand" href="index.html">
                <div class="navbar-logo"></div>
                <span class="navbar-title">LinkSocial</span>
            </a>
            <div class="navbar-actions">
                <button class="btn btn-icon btn-ghost" id="headerMsgBtn" title="Messages">
                    <span class="iconify" data-icon="ph:chats-circle" data-width="22"></span>
                </button>
                <button class="btn btn-icon btn-ghost" id="themeToggle" title="Toggle theme">
                    <span class="iconify" data-icon="ph:moon" data-width="20" id="themeIcon"></span>
                </button>
                <button class="btn btn-outline btn-sm" id="shareBtn">
                    <span class="iconify" data-icon="ph:plus" data-width="14"></span> Share
                </button>
                <div id="authArea"></div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="profile-cover">
            <div class="profile-avatar-wrap">
                <div class="profile-avatar" id="profileAvatar" style="background:var(--primary);">
                    <span class="iconify" data-icon="ph:user" data-width="40"></span>
                </div>
            </div>
        </div>
        <div class="profile-info">
            <div class="profile-name-row">
                <span class="profile-name" id="profileName">Loading...</span>
                <span class="profile-username" id="profileUsername">@loading</span>
                <span class="trust-badge-sm high" id="profileTrustBadge">
                    <span class="iconify" data-icon="ph:shield-check" data-width="12"></span> --%
                </span>
            </div>
            <p class="profile-bio" id="profileBio"></p>
            <div class="profile-meta">
                <span class="profile-meta-item" id="profileJoined">
                    <span class="iconify" data-icon="ph:calendar-blank" data-width="14"></span> Joined --
                </span>
                <span class="profile-meta-item" id="profileWebsite"></span>
            </div>
            <div class="profile-actions" id="profileActions"></div>
        </div>

        <div class="stats-bar" id="statsBar">
            <button class="stat-item active" data-tab="links">
                <div class="stat-value" id="statLinks">0</div>
                <div class="stat-label">Links</div>
            </button>
            <button class="stat-item" data-tab="followers">
                <div class="stat-value" id="statFollowers">0</div>
                <div class="stat-label">Followers</div>
            </button>
            <button class="stat-item" data-tab="following">
                <div class="stat-value" id="statFollowing">0</div>
                <div class="stat-label">Following</div>
            </button>
        </div>

        <div style="display:grid;grid-template-columns:1fr 300px;gap:1.5rem;">
            <div class="tab-content" id="tabContent">
                <div class="loading-spinner"><div class="spinner"></div></div>
            </div>
            <div style="display:flex;flex-direction:column;gap:1rem;position:sticky;top:68px;align-self:start;">
                <div class="side-card">
                    <div class="side-card-title">
                        <span class="iconify" data-icon="ph:trophy" data-width="14"></span> Top Links
                    </div>
                    <div id="topLinksList">
                        <p style="font-size:0.8rem;color:var(--text-tertiary);">Loading...</p>
                    </div>
                </div>
                <div style="text-align:center;padding:1rem;font-size:0.7rem;color:var(--text-tertiary);">
                    <a href="https://pireactive.vercel.app/" target="_blank" rel="noopener" style="color:var(--primary);font-weight:600;">LinkSocial © 2026 · Built by PIReactive</a>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        var firebaseConfig = {
            apiKey: "AIzaSyBbrRHlakmOdKwuDGwYAx5qf-e6DOHW7s0",
            authDomain: "joefootball-15e7a.firebaseapp.com",
            projectId: "joefootball-15e7a",
            storageBucket: "joefootball-15e7a.firebasestorage.app"
        };
        firebase.initializeApp(firebaseConfig);
        var db = firebase.firestore();
        var auth = firebase.auth();

        function $(s) { return document.querySelector(s); }
        function $$(s) { return document.querySelectorAll(s); }
        function esc(s) {
            if (!s) return '';
            return String(s).replace(/[&<>"']/g, function(m) {
                return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[m];
            });
        }
        function getDomain(u) {
            try { return new URL(u).hostname.replace('www.', ''); } catch(e) { return u; }
        }
        function timeAgo(ts) {
            if (!ts) return '';
            var s = Math.floor((Date.now() - ts) / 1000);
            if (s < 60) return 'now';
            if (s < 3600) return Math.floor(s / 60) + 'm';
            if (s < 86400) return Math.floor(s / 3600) + 'h';
            return Math.floor(s / 86400) + 'd';
        }
        function fmtNum(n) {
            if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
            if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
            return String(n);
        }
        function userColor(u) {
            var h = 0;
            for (var i = 0; i < (u || 'a').length; i++) {
                h = u.charCodeAt(i) + ((h << 5) - h);
            }
            return 'hsl(' + Math.abs(h % 360) + ',50%,45%)';
        }

        var currentUser = null;
        var profileUser = null;
        var profileUid = null;
        var allUserLinks = [];
        var activeTab = 'links';
        var isFollowing = false;

        function toast(msg, type) {
            type = type || 'success';
            var el = document.createElement('div');
            el.className = 'toast ' + type;
            el.textContent = msg;
            $('#toastContainer').appendChild(el);
            setTimeout(function() {
                el.style.opacity = '0';
                el.style.transform = 'translateY(10px)';
                el.style.transition = 'all 0.3s';
                setTimeout(function() { el.remove(); }, 300);
            }, 2500);
        }

        function setTheme(t) {
            document.body.classList.remove('theme-light', 'theme-dark');
            document.body.classList.add('theme-' + t);
            $('#themeIcon').setAttribute('data-icon', t === 'dark' ? 'ph:sun' : 'ph:moon');
            localStorage.setItem('ls-theme', t);
        }

        function renderAuthUI() {
            var a = $('#authArea');
            if (currentUser) {
                var color = currentUser.accentColor || userColor(currentUser.username);
                var initial = currentUser.emoji || (currentUser.username || 'U')[0].toUpperCase();
                var name = esc(currentUser.username || 'User');
                a.innerHTML = '<button class="btn btn-ghost btn-sm" id="profileBtn" style="display:flex;align-items:center;gap:6px;"><span style="width:26px;height:26px;border-radius:50%;background:' + color + ';display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:0.65rem;">' + initial + '</span>' + name + '</button>';
                setTimeout(function() {
                    var b = $('#profileBtn');
                    if (b) b.onclick = function() { window.open('index.html', '_self'); };
                }, 50);
            } else {
                a.innerHTML = '<button class="btn btn-primary btn-sm" id="signinBtn">Sign In</button>';
                setTimeout(function() {
                    var b = $('#signinBtn');
                    if (b) b.onclick = function() { window.open('index.html', '_self'); };
                }, 50);
            }
        }

        async function loadProfile() {
            var p = new URLSearchParams(window.location.search);
            profileUid = p.get('uid');
            if (!profileUid) {
                $('#tabContent').innerHTML = '<div class="empty-state"><div class="empty-state-icon"><span class="iconify" data-icon="ph:warning-circle" data-width="40"></span></div><p class="empty-state-title">No user specified</p></div>';
                window.Iconify.scan($('#tabContent'));
                return;
            }
            var doc = await db.collection('users').doc(profileUid).get();
            if (!doc.exists) {
                $('#tabContent').innerHTML = '<div class="empty-state"><div class="empty-state-icon"><span class="iconify" data-icon="ph:user-circle" data-width="40"></span></div><p class="empty-state-title">User not found</p></div>';
                window.Iconify.scan($('#tabContent'));
                return;
            }
            profileUser = doc.data();
            profileUser.uid = profileUid;
            var followers = profileUser.followers || [];
            isFollowing = currentUser && followers.indexOf(currentUser.uid) !== -1;
            renderHeader();
            var snap = await db.collection('links').where('ownerId', '==', profileUid).orderBy('createdAt', 'desc').get();
            allUserLinks = [];
            snap.docs.forEach(function(d) {
                var data = d.data();
                data.id = d.id;
                data.upvotes = data.upvotes || 0;
                data.downvotes = data.downvotes || 0;
                data.comments = data.comments || [];
                data.views = data.views || 0;
                allUserLinks.push(data);
            });
            updateStats();
            loadTopLinks();
            renderTab('links');
        }

        function renderHeader() {
            $('#profileName').textContent = (profileUser.emoji || '') + ' ' + esc(profileUser.username || 'User');
            $('#profileUsername').textContent = '@' + esc(profileUser.username || 'user');
            $('#profileBio').textContent = profileUser.bio || '';
            $('#profileAvatar').style.background = profileUser.accentColor || userColor(profileUser.username);
            
            if (profileUser.emoji) {
                $('#profileAvatar').innerHTML = '<span style="font-size:2.2rem;">' + profileUser.emoji + '</span>';
            } else {
                var initial = (profileUser.username || 'U')[0].toUpperCase();
                $('#profileAvatar').innerHTML = '<span style="font-size:2.2rem;font-weight:700;">' + initial + '</span>';
            }
            
            var joinDate = '--';
            if (profileUser.createdAt) {
                joinDate = new Date(profileUser.createdAt).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            }
            $('#profileJoined').innerHTML = '<span class="iconify" data-icon="ph:calendar-blank" data-width="14"></span> Joined ' + joinDate;
            
            if (profileUser.website) {
                $('#profileWebsite').style.display = '';
                $('#profileWebsite').innerHTML = '<a href="' + esc(profileUser.website) + '" target="_blank" rel="noopener" style="color:var(--primary);display:flex;align-items:center;gap:0.35rem;"><span class="iconify" data-icon="ph:globe" data-width="14"></span> ' + esc(getDomain(profileUser.website)) + '</a>';
            } else {
                $('#profileWebsite').style.display = 'none';
            }
            
            var own = currentUser && currentUser.uid === profileUid;
            var h = '';
            if (own) {
                h = '<button class="btn btn-outline btn-sm" id="editBioBtn"><span class="iconify" data-icon="ph:pencil-simple" data-width="14"></span> Edit Bio</button>';
            } else if (currentUser) {
                var icon = isFollowing ? 'ph:user-minus' : 'ph:user-plus';
                var label = isFollowing ? 'Unfollow' : 'Follow';
                var btnClass = isFollowing ? 'btn-outline' : 'btn-primary';
                h = '<button class="btn ' + btnClass + ' btn-sm" id="followBtn"><span class="iconify" data-icon="' + icon + '" data-width="14"></span> ' + label + '</button>';
                if (isFollowing) {
                    h += '<button class="btn btn-outline btn-sm" id="msgBtn"><span class="iconify" data-icon="ph:chat-circle" data-width="14"></span> Message</button>';
                }
            } else {
                h = '<button class="btn btn-primary btn-sm" id="followBtn"><span class="iconify" data-icon="ph:user-plus" data-width="14"></span> Follow</button>';
            }
            $('#profileActions').innerHTML = h;
            window.Iconify.scan($('#profileActions'));
            
            setTimeout(function() {
                var fb = $('#followBtn');
                if (fb) fb.onclick = toggleFollow;
                var mb = $('#msgBtn');
                if (mb) mb.onclick = openChat;
                var eb = $('#editBioBtn');
                if (eb) eb.onclick = editBio;
            }, 50);
        }

        function updateStats() {
            $('#statLinks').textContent = fmtNum(allUserLinks.length);
            var followers = profileUser.followers || [];
            var following = profileUser.following || [];
            $('#statFollowers').textContent = fmtNum(followers.length);
            $('#statFollowing').textContent = fmtNum(following.length);
            
            var avgTrust = '-';
            if (allUserLinks.length > 0) {
                var total = 0;
                allUserLinks.forEach(function(l) { total += (l.trustScore || 50); });
                avgTrust = Math.round(total / allUserLinks.length);
            }
            var tc = 'high';
            if (typeof avgTrust === 'number') {
                if (avgTrust < 40) tc = 'low';
                else if (avgTrust < 70) tc = 'medium';
            }
            $('#profileTrustBadge').innerHTML = '<span class="iconify" data-icon="ph:shield-check" data-width="12"></span> ' + avgTrust + '%';
            $('#profileTrustBadge').className = 'trust-badge-sm ' + tc;
        }

        function loadTopLinks() {
            var sorted = allUserLinks.slice().sort(function(a, b) {
                return (b.upvotes - b.downvotes) - (a.upvotes - a.downvotes);
            });
            var top = sorted.slice(0, 3);
            if (top.length === 0) {
                $('#topLinksList').innerHTML = '<p style="font-size:0.8rem;color:var(--text-tertiary);">No links yet</p>';
                return;
            }
            var html = '';
            top.forEach(function(l, i) {
                var net = (l.upvotes || 0) - (l.downvotes || 0);
                html += '<div style="padding:0.4rem 0;font-size:0.8rem;cursor:pointer;" onclick="window.open(\'index.html?link=' + l.id + '\',\'_self\')"><strong>#' + (i + 1) + '</strong> ' + esc(l.title || 'Untitled') + '<br><span style="color:var(--text-tertiary);font-size:0.7rem;"><span class="iconify" data-icon="ph:arrow-fat-up" data-width="10"></span> ' + fmtNum(net) + '</span></div>';
            });
            $('#topLinksList').innerHTML = html;
            window.Iconify.scan($('#topLinksList'));
        }

        async function renderTab(tab) {
            activeTab = tab;
            $$('.stat-item').forEach(function(s) { s.classList.remove('active'); });
            var el = $('.stat-item[data-tab="' + tab + '"]');
            if (el) el.classList.add('active');
            var c = $('#tabContent');
            
            if (tab === 'links') {
                if (allUserLinks.length === 0) {
                    c.innerHTML = '<div class="empty-state"><div class="empty-state-icon"><span class="iconify" data-icon="ph:link-simple" data-width="40"></span></div><p class="empty-state-title">No links shared yet</p></div>';
                    window.Iconify.scan(c);
                    return;
                }
                var html = '';
                allUserLinks.forEach(function(l) {
                    var sc = l.screenshot || l.previewImage || '';
                    var net = (l.upvotes || 0) - (l.downvotes || 0);
                    html += '<div class="link-card" onclick="window.open(\'index.html?link=' + l.id + '\',\'_self\')">';
                    html += '<div class="link-card-screenshot">';
                    if (sc) {
                        html += '<img src="' + esc(sc) + '" alt="" loading="lazy" onerror="this.parentElement.innerHTML=\'<span class=no-img><span class=iconify data-icon=ph:link-simple data-width=24></span></span>\'">';
                    } else {
                        html += '<span class="no-img"><span class="iconify" data-icon="ph:link-simple" data-width="24"></span></span>';
                    }
                    html += '</div>';
                    html += '<div class="link-card-info">';
                    html += '<div class="link-card-title">' + esc(l.title || 'Untitled') + '</div>';
                    if (l.description) {
                        html += '<div class="link-card-desc">' + esc(l.description) + '</div>';
                    }
                    html += '<div class="link-card-stats">';
                    html += '<span class="link-card-stat"><span class="iconify" data-icon="ph:arrow-fat-up" data-width="12"></span> ' + fmtNum(net) + '</span>';
                    html += '<span class="link-card-stat"><span class="iconify" data-icon="ph:chat-circle" data-width="12"></span> ' + fmtNum((l.comments || []).length) + '</span>';
                    html += '<span class="link-card-stat"><span class="iconify" data-icon="ph:eye" data-width="12"></span> ' + fmtNum(l.views || 0) + '</span>';
                    html += '<span class="link-card-stat"><span class="iconify" data-icon="ph:shield-check" data-width="12"></span> ' + (l.trustScore || 50) + '%</span>';
                    html += '<span class="link-card-stat"><span class="iconify" data-icon="ph:clock" data-width="12"></span> ' + timeAgo(l.createdAt) + '</span>';
                    html += '</div></div></div>';
                });
                c.innerHTML = html;
            } else {
                var list = profileUser[tab] || [];
                if (list.length === 0) {
                    var icon = tab === 'followers' ? 'ph:users' : 'ph:user';
                    var title = tab === 'followers' ? 'No followers yet' : 'Not following anyone';
                    c.innerHTML = '<div class="empty-state"><div class="empty-state-icon"><span class="iconify" data-icon="' + icon + '" data-width="40"></span></div><p class="empty-state-title">' + title + '</p></div>';
                    window.Iconify.scan(c);
                    return;
                }
                c.innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';
                var users = [];
                for (var i = 0; i < list.length; i++) {
                    var d = await db.collection('users').doc(list[i]).get();
                    if (d.exists) {
                        var u = d.data();
                        u.uid = list[i];
                        users.push(u);
                    }
                }
                var html = '';
                users.forEach(function(u) {
                    var color = u.accentColor || userColor(u.username);
                    var initial = u.emoji || (u.username || 'U')[0].toUpperCase();
                    html += '<div class="person-card" onclick="window.open(\'profile.html?uid=' + u.uid + '\',\'_self\')">';
                    html += '<div class="person-avatar" style="background:' + color + ';">' + (u.emoji ? '<span style="font-size:1.2rem;">' + u.emoji + '</span>' : initial) + '</div>';
                    html += '<div><div class="person-name">' + esc(u.username || 'User') + '</div>';
                    html += '<div class="person-username">@' + esc(u.username || 'user') + '</div></div></div>';
                });
                c.innerHTML = html;
            }
            window.Iconify.scan(c);
        }

        async function toggleFollow() {
            if (!currentUser || !profileUid) return;
            var ref = db.collection('users').doc(profileUid);
            var doc = await ref.get();
            if (!doc.exists) return;
            var followers = doc.data().followers || [];
            if (followers.indexOf(currentUser.uid) !== -1) {
                followers = followers.filter(function(u) { return u !== currentUser.uid; });
                isFollowing = false;
                toast('Unfollowed', 'info');
            } else {
                followers.push(currentUser.uid);
                isFollowing = true;
                toast('Following!', 'success');
            }
            await ref.update({ followers: followers });
            var me = await db.collection('users').doc(currentUser.uid).get();
            if (me.exists) {
                var f = me.data().following || [];
                if (isFollowing) {
                    if (f.indexOf(profileUid) === -1) f.push(profileUid);
                } else {
                    f = f.filter(function(u) { return u !== profileUid; });
                }
                await db.collection('users').doc(currentUser.uid).update({ following: f });
            }
            profileUser.followers = followers;
            updateStats();
            renderHeader();
        }

        function openChat() {
            if (!currentUser) { toast('Sign in to chat', 'error'); return; }
            var followers = profileUser.followers || [];
            if (followers.indexOf(currentUser.uid) === -1) { toast('Follow to message', 'error'); return; }
            window.open('chat.html?uid=' + profileUid, '_self');
        }

        async function editBio() {
            var b = prompt('Edit bio:', profileUser.bio || '');
            if (b !== null) {
                await db.collection('users').doc(profileUid).update({ bio: b });
                profileUser.bio = b;
                renderHeader();
                toast('Bio updated!', 'success');
            }
        }

        $$('#statsBar .stat-item').forEach(function(s) {
            s.addEventListener('click', function() { renderTab(this.dataset.tab); });
        });

        auth.onAuthStateChanged(async function(u) {
            if (u) {
                var d = await db.collection('users').doc(u.uid).get();
                if (d.exists) { currentUser = d.data(); currentUser.uid = u.uid; }
                else { currentUser = { uid: u.uid, username: (u.email || 'user').split('@')[0], accentColor: userColor((u.email || 'user').split('@')[0]), emoji: '👤' }; }
            } else { currentUser = null; }
            renderAuthUI();
        });

        document.addEventListener('DOMContentLoaded', function() {
            var t = localStorage.getItem('ls-theme') || 'light';
            setTheme(t);
            $('#themeToggle').addEventListener('click', function() {
                var cur = document.body.classList.contains('theme-dark') ? 'dark' : 'light';
                setTheme(cur === 'dark' ? 'light' : 'dark');
            });
            $('#shareBtn').addEventListener('click', function() { window.open('add-link.html', '_self'); });
            $('#headerMsgBtn').addEventListener('click', function() { window.open('chat.html', '_self'); });
            renderAuthUI();
            loadProfile();
        });
    </script>
</body>
</html>
