<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Profile — LinkSocial</title>
    <meta name="description" content="View profile on LinkSocial">
    <meta name="theme-color" content="#6c47ff">
    <meta property="og:title" content="Profile — LinkSocial">
    <meta property="og:image" content="src/og-image.png">
    <link rel="icon" type="image/png" href="src/og-image.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        :root{--font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Roboto,'Helvetica Neue',Arial,sans-serif;--transition-fast:150ms cubic-bezier(0.4,0,0.2,1);--transition-base:250ms cubic-bezier(0.4,0,0.2,1);--radius-sm:0.375rem;--radius-md:0.5rem;--radius-lg:0.75rem;--radius-xl:1rem;--radius-2xl:1.5rem;--radius-full:9999px}
        .theme-light{--bg-main:#f4f2ee;--bg-surface:#ffffff;--bg-hover:#f9fafb;--bg-input:#f1f5f9;--border:#e2e8f0;--border-light:#f1f5f9;--text-primary:#0f172a;--text-secondary:#475569;--text-tertiary:#94a3b8;--primary:#6c47ff;--primary-hover:#5835e8;--primary-light:#f0ebff;--secondary:#3b82f6;--success:#059669;--success-bg:#ecfdf5;--warning:#d97706;--warning-bg:#fffbeb;--danger:#dc2626;--danger-bg:#fef2f2;--card-shadow:0 0 0 1px rgba(0,0,0,0.05);--shadow-lg:0 10px 25px rgba(0,0,0,0.08);--logo-url:url('https://i.ibb.co/Z67LrCG7/L-1.png')}
        .theme-dark{--bg-main:#0f172a;--bg-surface:#1e293b;--bg-hover:#263348;--bg-input:#1a2744;--border:#334155;--border-light:#263348;--text-primary:#f1f5f9;--text-secondary:#cbd5e1;--text-tertiary:#64748b;--primary:#8b6cff;--primary-hover:#7b5ce8;--primary-light:#1e1a3a;--secondary:#60a5fa;--success:#10b981;--success-bg:#022c22;--warning:#f59e0b;--warning-bg:#422006;--danger:#ef4444;--danger-bg:#2a0a0a;--card-shadow:0 0 0 1px rgba(255,255,255,0.05);--shadow-lg:0 10px 25px rgba(0,0,0,0.3);--logo-url:url('https://i.ibb.co/jPxVQH4X/L-2.png')}
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;scroll-behavior:smooth}
        body{font-family:var(--font-family);background:var(--bg-main);color:var(--text-primary);line-height:1.5;min-height:100vh;transition:background var(--transition-base),color var(--transition-base)}

        @keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

        .navbar{position:sticky;top:0;z-index:100;background:var(--bg-surface);border-bottom:1px solid var(--border);height:52px;display:flex;align-items:center;padding:0 1.25rem;box-shadow:0 0 0 1px rgba(0,0,0,0.04)}
        .navbar-inner{max-width:1128px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between;gap:0.75rem}
        .navbar-brand{display:flex;align-items:center;gap:0.5rem;cursor:pointer;text-decoration:none}
        .navbar-logo{width:34px;height:34px;background-image:var(--logo-url);background-size:contain;background-repeat:no-repeat;background-position:center;border-radius:var(--radius-sm)}
        .navbar-title{font-size:1.125rem;font-weight:700;letter-spacing:-0.3px}
        .navbar-actions{display:flex;align-items:center;gap:0.375rem}
        .msg-badge{position:relative}
        .msg-count{position:absolute;top:-5px;right:-7px;background:var(--danger);color:#fff;font-size:0.6rem;font-weight:700;min-width:17px;height:17px;border-radius:var(--radius-full);display:none;align-items:center;justify-content:center;padding:0 5px}

        .btn{display:inline-flex;align-items:center;justify-content:center;gap:0.35rem;padding:0.5rem 1rem;border-radius:var(--radius-full);font-weight:600;font-size:0.875rem;transition:all var(--transition-fast);cursor:pointer;font-family:var(--font-family);border:none;white-space:nowrap}
        .btn:active{transform:scale(0.97)}
        .btn-primary{background:var(--primary);color:#fff}
        .btn-primary:hover{background:var(--primary-hover)}
        .btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}
        .btn-outline:hover{background:var(--primary-light)}
        .btn-ghost{background:transparent;color:var(--text-secondary)}
        .btn-ghost:hover{background:var(--bg-hover)}
        .btn-sm{padding:0.3rem 0.75rem;font-size:0.8rem}
        .btn-icon{width:36px;height:36px;padding:0;border-radius:var(--radius-full)}
        .btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#b91c1c}

        .container{max-width:900px;margin:0 auto;padding:0 1rem}
        .profile-cover{height:160px;background:linear-gradient(135deg,var(--primary),var(--secondary));border-radius:0 0 var(--radius-2xl) var(--radius-2xl);position:relative;margin-bottom:60px;animation:fadeIn 0.5s ease-out}
        .profile-avatar-wrap{position:absolute;bottom:-50px;left:2rem;width:100px;height:100px;border-radius:var(--radius-full);border:4px solid var(--bg-surface);background:var(--bg-surface);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,0.12)}
        .profile-avatar{width:88px;height:88px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:2rem;color:#fff}
        .profile-info{margin-top:0.75rem;animation:fadeInUp 0.4s ease-out}
        .profile-name-row{display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap}
        .profile-name{font-size:1.5rem;font-weight:800;letter-spacing:-0.3px}
        .profile-username{font-size:0.95rem;color:var(--text-tertiary);font-weight:500}
        .profile-bio{font-size:0.9rem;color:var(--text-secondary);margin:0.5rem 0;line-height:1.5}
        .profile-meta{display:flex;gap:1rem;flex-wrap:wrap;font-size:0.8rem;color:var(--text-tertiary);margin:0.5rem 0}
        .profile-meta-item{display:flex;align-items:center;gap:0.3rem}
        .profile-actions{display:flex;gap:0.5rem;margin-top:0.75rem;flex-wrap:wrap}

        .trust-badge-sm{display:inline-flex;align-items:center;gap:0.2rem;padding:0.2rem 0.5rem;border-radius:var(--radius-full);font-size:0.65rem;font-weight:700}
        .trust-badge-sm.high{background:var(--success-bg);color:var(--success)}.trust-badge-sm.medium{background:var(--warning-bg);color:var(--warning)}.trust-badge-sm.low{background:var(--danger-bg);color:var(--danger)}

        .stats-bar{display:flex;gap:0;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-xl);margin:1.5rem 0;overflow:hidden;box-shadow:var(--card-shadow);animation:fadeInUp 0.4s ease-out 0.1s both}
        .stat-item{flex:1;text-align:center;padding:1rem 0.5rem;cursor:pointer;transition:all var(--transition-fast);border-right:1px solid var(--border-light)}
        .stat-item:last-child{border-right:none}
        .stat-item:hover{background:var(--bg-hover)}
        .stat-item.active{background:var(--primary-light);color:var(--primary)}
        .stat-item.active .stat-value{color:var(--primary)}
        .stat-value{font-size:1.25rem;font-weight:800;color:var(--text-primary)}
        .stat-label{font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-tertiary);margin-top:0.15rem}

        .content-grid{display:grid;grid-template-columns:1fr 320px;gap:1.5rem;padding-bottom:3rem}
        .main-col{min-width:0}
        .side-col{display:flex;flex-direction:column;gap:1rem;position:sticky;top:68px;align-self:start}

        .section-title{font-size:0.9rem;font-weight:700;margin-bottom:0.75rem;display:flex;align-items:center;gap:0.5rem}
        .link-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem;margin-bottom:0.5rem;box-shadow:var(--card-shadow);transition:all var(--transition-fast);display:flex;gap:0.75rem;cursor:pointer;animation:fadeInUp 0.3s ease-out}
        .link-card:hover{box-shadow:var(--shadow-lg)}
        .link-card-screenshot{width:120px;height:80px;border-radius:var(--radius-md);overflow:hidden;flex-shrink:0;background:var(--bg-hover);border:1px solid var(--border-light)}
        .link-card-screenshot img{width:100%;height:100%;object-fit:cover}
        .link-card-screenshot .no-img{display:flex;align-items:center;justify-content:center;height:100%;font-size:1.5rem;color:var(--text-tertiary)}
        .link-card-info{flex:1;min-width:0}
        .link-card-title{font-weight:600;font-size:0.9rem;margin-bottom:0.2rem;line-height:1.3}
        .link-card-title:hover{color:var(--primary)}
        .link-card-desc{font-size:0.78rem;color:var(--text-secondary);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .link-card-stats{display:flex;gap:0.75rem;font-size:0.72rem;color:var(--text-tertiary);margin-top:0.35rem}
        .link-card-stat{display:flex;align-items:center;gap:0.2rem}

        .side-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:1.25rem;box-shadow:var(--card-shadow);animation:fadeInUp 0.4s ease-out 0.2s both}
        .side-card-title{font-size:0.8rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-tertiary);margin-bottom:0.75rem}
        .follower-item{display:flex;align-items:center;gap:0.6rem;padding:0.5rem;cursor:pointer;transition:all var(--transition-fast);border-radius:var(--radius-sm)}
        .follower-item:hover{background:var(--bg-hover)}
        .follower-avatar{width:40px;height:40px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:0.75rem;flex-shrink:0}
        .follower-name{font-weight:600;font-size:0.85rem}
        .follower-username{font-size:0.72rem;color:var(--text-tertiary)}

        .empty-state{text-align:center;padding:2rem;color:var(--text-tertiary)}
        .empty-state-icon{font-size:2.5rem;margin-bottom:0.5rem;opacity:0.5}
        .loading-spinner{display:flex;align-items:center;justify-content:center;padding:3rem}
        .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 0.7s linear infinite}
        .toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);padding:0.8rem 1.5rem;border-radius:var(--radius-lg);font-size:0.85rem;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.15);z-index:200;animation:slideIn 0.3s ease-out}
        .toast.success{background:var(--success);color:#fff}.toast.error{background:var(--danger);color:#fff}.toast.info{background:var(--primary);color:#fff}

        @media(max-width:768px){.content-grid{grid-template-columns:1fr}.side-col{position:static}.profile-cover{height:120px}.profile-avatar-wrap{left:1rem;width:80px;height:80px;bottom:-40px}.profile-avatar{width:70px;height:70px;font-size:1.5rem}.profile-name{font-size:1.25rem}.stat-item{padding:0.75rem 0.25rem}.stat-value{font-size:1rem}}
    </style>
</head>
<body class="theme-light">
    <nav class="navbar">
        <div class="navbar-inner">
            <a class="navbar-brand" href="index.html"><div class="navbar-logo"></div><span class="navbar-title">LinkSocial</span></a>
            <div class="navbar-actions">
                <button class="btn btn-icon btn-ghost msg-badge" id="headerMsgBtn" title="Messages" onclick="window.open('chat.html','_self')"><span class="iconify" data-icon="ph:chats-circle" data-width="22"></span><span class="msg-count" id="headerMsgCount">0</span></button>
                <button class="btn btn-icon btn-ghost" id="themeToggle" title="Toggle theme"><span class="iconify" data-icon="ph:moon" data-width="20" id="themeIcon"></span></button>
                <button class="btn btn-outline btn-sm" onclick="window.open('add-link.html','_self')"><span class="iconify" data-icon="ph:plus" data-width="14"></span> Share</button>
                <div id="authArea"></div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="profile-cover"></div>
        <div class="profile-avatar-wrap"><div class="profile-avatar" id="profileAvatar" style="background:var(--primary);">L</div></div>
        <div class="profile-info">
            <div class="profile-name-row">
                <span class="profile-name" id="profileName">Loading...</span>
                <span class="profile-username" id="profileUsername">@loading</span>
                <span class="trust-badge-sm high" id="profileTrustBadge">🛡 --%</span>
            </div>
            <p class="profile-bio" id="profileBio"></p>
            <div class="profile-meta">
                <span class="profile-meta-item" id="profileJoined"><span class="iconify" data-icon="ph:calendar" data-width="14"></span> Joined --</span>
                <span class="profile-meta-item" id="profileWebsite"></span>
            </div>
            <div class="profile-actions" id="profileActions"></div>
        </div>

        <div class="stats-bar">
            <div class="stat-item active" data-tab="links" onclick="switchTab('links')"><div class="stat-value" id="statLinks">0</div><div class="stat-label">Links</div></div>
            <div class="stat-item" data-tab="followers" onclick="switchTab('followers')"><div class="stat-value" id="statFollowers">0</div><div class="stat-label">Followers</div></div>
            <div class="stat-item" data-tab="following" onclick="switchTab('following')"><div class="stat-value" id="statFollowing">0</div><div class="stat-label">Following</div></div>
        </div>

        <div class="content-grid">
            <div class="main-col" id="mainContent"><div class="loading-spinner"><div class="spinner"></div></div></div>
            <div class="side-col">
                <div class="side-card"><div class="side-card-title">🏆 Top Links</div><div id="topLinksList"><p style="font-size:0.8rem;color:var(--text-tertiary);">Loading...</p></div></div>
                <div class="side-card" id="publicFoldersCard" style="display:none;"><div class="side-card-title">📁 Public Folders</div><div id="publicFoldersList"></div></div>
                <div style="text-align:center;padding:1rem;font-size:0.7rem;color:var(--text-tertiary);"><a href="https://pireactive.vercel.app/" target="_blank" rel="noopener" style="color:var(--primary);font-weight:600;">LinkSocial © 2026 · Built by PIReactive</a></div>
            </div>
        </div>
    </div>

    <div style="position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:0.5rem;" id="toastContainer"></div>

    <script>
        const firebaseConfig={apiKey:"AIzaSyBbrRHlakmOdKwuDGwYAx5qf-e6DOHW7s0",authDomain:"joefootball-15e7a.firebaseapp.com",projectId:"joefootball-15e7a",storageBucket:"joefootball-15e7a.firebasestorage.app"};
        firebase.initializeApp(firebaseConfig);const db=firebase.firestore();const auth=firebase.auth();

        let currentUser=null,profileUser=null,profileUid=null,allUserLinks=[],activeTab='links',unreadMsgCount=0;

        const $=s=>document.querySelector(s);const $$=s=>document.querySelectorAll(s);
        const esc=s=>s?String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]):'';
        const getDomain=u=>{try{return new URL(u).hostname.replace('www.','')}catch{return u}};
        const timeAgo=ts=>{if(!ts)return'';const s=Math.floor((Date.now()-ts)/1000);if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';if(s<2592000)return Math.floor(s/86400)+'d ago';return Math.floor(s/2592000)+'mo ago'};
        const fmtNum=n=>n>=1000000?(n/1000000).toFixed(1)+'M':n>=1000?(n/1000).toFixed(1)+'K':String(n);
        const userColor=u=>{let h=0;for(let i=0;i<(u||'a').length;i++)h=u.charCodeAt(i)+((h<<5)-h);return`hsl(${Math.abs(h%360)},50%,45%)`};

        function updateMsgBadge(){const c=unreadMsgCount;if(c>0){$('#headerMsgCount').style.display='flex';$('#headerMsgCount').textContent=c>9?'9+':String(c)}else{$('#headerMsgCount').style.display='none'}}
        function toast(m,t='success'){const c=$('#toastContainer'),el=document.createElement('div');el.className=`toast ${t}`;el.textContent=m;c.appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transform='translateY(10px)';el.style.transition='all 0.3s';setTimeout(()=>el.remove(),300)},3000)}
        function setTheme(t){document.body.classList.remove('theme-light','theme-dark');document.body.classList.add(`theme-${t}`);$('#themeIcon').setAttribute('data-icon',t==='dark'?'ph:sun':'ph:moon');localStorage.setItem('ls-theme',t)}

        function renderAuthUI(){
            const a=$('#authArea');
            if(currentUser){a.innerHTML=`<button class="btn btn-ghost btn-sm" onclick="signOut()" style="display:flex;align-items:center;gap:6px;"><span style="width:26px;height:26px;border-radius:50%;background:${currentUser.accentColor||userColor(currentUser.username)};display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:0.65rem;">${currentUser.emoji||(currentUser.username||'U')[0].toUpperCase()}</span>${esc(currentUser.username||'User')}</button>`}
            else{a.innerHTML=`<button class="btn btn-primary btn-sm" onclick="window.open('index.html','_self')">Sign In</button>`}
        }

        async function signOut(){await auth.signOut();currentUser=null;renderAuthUI();toast('Signed out','info')}

        async function loadProfile(){
            const params=new URLSearchParams(window.location.search);profileUid=params.get('uid');
            if(!profileUid){showError('No user specified');return}
            try{
                const userDoc=await db.collection('users').doc(profileUid).get();
                if(!userDoc.exists){showError('User not found');return}
                profileUser={uid:profileUid,...userDoc.data()};
                renderProfileHeader();
                await loadUserLinks();
                await loadStats();
                await loadTopLinks();
                await loadPublicFolders();
                renderTab('links');
            }catch(e){showError('Error loading profile')}
        }

        function renderProfileHeader(){
            $('#profileName').textContent=(profileUser.emoji||'')+' '+esc(profileUser.username||'User');
            $('#profileUsername').textContent='@'+esc(profileUser.username||'user');
            $('#profileBio').textContent=profileUser.bio||'';
            $('#profileAvatar').style.background=profileUser.accentColor||userColor(profileUser.username);
            $('#profileAvatar').textContent=profileUser.emoji||(profileUser.username||'U')[0].toUpperCase();
            $('#profileJoined').innerHTML=`<span class="iconify" data-icon="ph:calendar" data-width="14"></span> Joined ${profileUser.createdAt?new Date(profileUser.createdAt).toLocaleDateString('en-US',{month:'long',year:'numeric'}):'--'}`;
            if(profileUser.website){$('#profileWebsite').style.display='';$('#profileWebsite').innerHTML=`<a href="${esc(profileUser.website)}" target="_blank" rel="noopener" style="color:var(--primary);"><span class="iconify" data-icon="ph:globe" data-width="14"></span> ${esc(getDomain(profileUser.website))}</a>`}else{$('#profileWebsite').style.display='none'}
            const isOwn=currentUser&&currentUser.uid===profileUid;
            const followers=profileUser.followers||[];
            const isFollowing=currentUser&&followers.includes(currentUser.uid);
            let actionsHtml='';
            if(isOwn){actionsHtml=`<button class="btn btn-outline btn-sm" onclick="editProfile()"><span class="iconify" data-icon="ph:pencil" data-width="14"></span> Edit Profile</button><button class="btn btn-ghost btn-sm" onclick="shareProfile()"><span class="iconify" data-icon="ph:share" data-width="14"></span> Share</button>`}
            else if(currentUser){actionsHtml=`<button class="btn ${isFollowing?'btn-outline':'btn-primary'} btn-sm" onclick="toggleFollow()"><span class="iconify" data-icon="${isFollowing?'ph:user-minus':'ph:user-plus'}" data-width="14"></span> ${isFollowing?'Unfollow':'Follow'}</button>${isFollowing?`<button class="btn btn-outline btn-sm" onclick="openChat()"><span class="iconify" data-icon="ph:chat-circle" data-width="14"></span> Message</button>`:''}`}
            else{actionsHtml=`<button class="btn btn-primary btn-sm" onclick="window.open('index.html','_self')"><span class="iconify" data-icon="ph:user-plus" data-width="14"></span> Follow</button>`}
            $('#profileActions').innerHTML=actionsHtml;
            window.Iconify?.scan?.($('#profileActions'));
        }

        async function loadUserLinks(){const snap=await db.collection('links').where('ownerId','==',profileUid).orderBy('createdAt','desc').get();allUserLinks=snap.docs.map(d=>({id:d.id,...d.data(),upvotes:d.data().upvotes||0,downvotes:d.data().downvotes||0,comments:d.data().comments||[],views:d.data().views||0}))}

        async function loadStats(){
            $('#statLinks').textContent=fmtNum(allUserLinks.length);
            const followers=profileUser.followers||[];$('#statFollowers').textContent=fmtNum(followers.length);
            const following=profileUser.following||[];$('#statFollowing').textContent=fmtNum(following.length);
            const avgTrust=allUserLinks.length>0?Math.round(allUserLinks.reduce((s,l)=>s+(l.trustScore||50),0)/allUserLinks.length):'-';
            const tc=typeof avgTrust==='number'?(avgTrust>=70?'high':avgTrust>=40?'medium':'low'):'high';
            $('#profileTrustBadge').textContent=`🛡 ${avgTrust}%`;
            $('#profileTrustBadge').className=`trust-badge-sm ${tc}`;
        }

        async function loadTopLinks(){
            const top=[...allUserLinks].sort((a,b)=>(b.upvotes-b.downvotes)-(a.upvotes-a.downvotes)).slice(0,3);
            $('#topLinksList').innerHTML=top.length>0?top.map((l,i)=>`<div style="padding:0.4rem 0;font-size:0.8rem;cursor:pointer;" onclick="openLink('${l.id}')"><strong>#${i+1}</strong> ${esc(l.title||'Untitled')}<br><span style="color:var(--text-tertiary);font-size:0.7rem;">👍 ${fmtNum((l.upvotes||0)-(l.downvotes||0))}</span></div>`).join(''):'<p style="font-size:0.8rem;color:var(--text-tertiary);">No links yet</p>';
        }

        async function loadPublicFolders(){
            const snap=await db.collection('users').doc(profileUid).collection('folders').where('visibility','==','public').get();
            const folders=snap.docs.map(d=>({id:d.id,...d.data()}));
            if(folders.length===0){$('#publicFoldersCard').style.display='none';return}
            $('#publicFoldersCard').style.display='block';
            const savedSnap=await db.collection('users').doc(profileUid).collection('savedLinks').get();
            const saved=savedSnap.docs.map(d=>d.data());
            $('#publicFoldersList').innerHTML=folders.map(f=>{const count=saved.filter(s=>s.folder===f.name).length;return`<div style="display:flex;align-items:center;justify-content:space-between;padding:0.35rem 0;font-size:0.8rem;cursor:pointer;" onclick="toast('Folder: ${esc(f.name)}','info')"><span>📁 ${esc(f.name)}</span><span style="color:var(--text-tertiary);">${count}</span></div>`}).join('');
        }

        function switchTab(tab){activeTab=tab;$$('.stat-item').forEach(s=>s.classList.remove('active'));$(`.stat-item[data-tab="${tab}"]`).classList.add('active');renderTab(tab)}

        async function renderTab(tab){
            const c=$('#mainContent');
            if(tab==='links')renderLinksTab(c);
            else if(tab==='followers')await renderFollowersTab(c);
            else if(tab==='following')await renderFollowingTab(c);
        }

        function renderLinksTab(c){
            if(allUserLinks.length===0){c.innerHTML='<div class="empty-state"><div class="empty-state-icon">🔗</div><p style="font-weight:600;">No links shared yet</p></div>';return}
            c.innerHTML=allUserLinks.map(l=>{const sc=l.screenshot||l.previewImage||'';return`<div class="link-card" onclick="openLink('${l.id}')"><div class="link-card-screenshot">${sc?`<img src="${esc(sc)}" alt="" loading="lazy" onerror="this.innerHTML='<span class=no-img>🔗</span>'">`:'<span class="no-img">🔗</span>'}</div><div class="link-card-info"><div class="link-card-title">${esc(l.title||'Untitled')}</div>${l.description?`<div class="link-card-desc">${esc(l.description)}</div>`:''}<div class="link-card-stats"><span class="link-card-stat"><span class="iconify" data-icon="ph:arrow-fat-up" data-width="12"></span> ${fmtNum((l.upvotes||0)-(l.downvotes||0))}</span><span class="link-card-stat"><span class="iconify" data-icon="ph:chat-circle" data-width="12"></span> ${fmtNum((l.comments||[]).length)}</span><span class="link-card-stat"><span class="iconify" data-icon="ph:eye" data-width="12"></span> ${fmtNum(l.views||0)}</span><span class="link-card-stat">🛡 ${l.trustScore||50}%</span><span class="link-card-stat">${timeAgo(l.createdAt)}</span></div></div></div>`}).join('');window.Iconify?.scan?.(c)}

        async function renderFollowersTab(c){
            const followers=profileUser.followers||[];
            if(followers.length===0){c.innerHTML='<div class="empty-state"><div class="empty-state-icon">👥</div><p style="font-weight:600;">No followers yet</p></div>';return}
            c.innerHTML='<div class="loading-spinner"><div class="spinner"></div></div>';
            const users=await Promise.all(followers.map(async uid=>{const d=await db.collection('users').doc(uid).get();return d.exists?{uid,...d.data()}:null}));
            c.innerHTML=users.filter(Boolean).map(u=>`<div class="link-card" onclick="window.open('profile.html?uid=${u.uid}','_self')" style="align-items:center;"><div class="follower-avatar" style="width:48px;height:48px;font-size:1rem;background:${u.accentColor||userColor(u.username)};">${u.emoji||(u.username||'U')[0].toUpperCase()}</div><div class="link-card-info"><div class="follower-name" style="font-size:0.9rem;">${esc(u.username||'User')}</div><div class="follower-username">@${esc(u.username||'user')}</div>${u.bio?`<div style="font-size:0.75rem;color:var(--text-secondary);">${esc(u.bio)}</div>`:''}</div></div>`).join('');
        }

        async function renderFollowingTab(c){
            const following=profileUser.following||[];
            if(following.length===0){c.innerHTML='<div class="empty-state"><div class="empty-state-icon">👤</div><p style="font-weight:600;">Not following anyone</p></div>';return}
            c.innerHTML='<div class="loading-spinner"><div class="spinner"></div></div>';
            const users=await Promise.all(following.map(async uid=>{const d=await db.collection('users').doc(uid).get();return d.exists?{uid,...d.data()}:null}));
            c.innerHTML=users.filter(Boolean).map(u=>`<div class="link-card" onclick="window.open('profile.html?uid=${u.uid}','_self')" style="align-items:center;"><div class="follower-avatar" style="width:48px;height:48px;font-size:1rem;background:${u.accentColor||userColor(u.username)};">${u.emoji||(u.username||'U')[0].toUpperCase()}</div><div class="link-card-info"><div class="follower-name" style="font-size:0.9rem;">${esc(u.username||'User')}</div><div class="follower-username">@${esc(u.username||'user')}</div></div></div>`).join('');
        }

        function openLink(id){window.open(`index.html?link=${id}`,'_self')}
        function shareProfile(){navigator.clipboard?.writeText(window.location.href);toast('Profile link copied!','success')}
        
        async function editProfile(){
            if(!currentUser||currentUser.uid!==profileUid)return;
            const bio=prompt('Edit bio:',profileUser.bio||'');
            if(bio!==null){await db.collection('users').doc(profileUid).update({bio});profileUser.bio=bio;renderProfileHeader();toast('Bio updated!','success')}
        }

        async function toggleFollow(){
            if(!currentUser){toast('Sign in to follow','error');return}
            const ref=db.collection('users').doc(profileUid);const doc=await ref.get();if(!doc.exists)return;
            const data=doc.data();let followers=data.followers||[];
            if(followers.includes(currentUser.uid)){followers=followers.filter(u=>u!==currentUser.uid);toast('Unfollowed','info')}
            else{followers.push(currentUser.uid);toast('Following!','success')}
            await ref.update({followers});
            const meRef=db.collection('users').doc(currentUser.uid);const meDoc=await meRef.get();
            if(meDoc.exists){let f=meDoc.data().following||[];if(followers.includes(currentUser.uid)){if(!f.includes(profileUid))f.push(profileUid)}else{f=f.filter(u=>u!==profileUid)}await meRef.update({following:f})}
            profileUser.followers=followers;await loadStats();renderProfileHeader();
        }

        function openChat(){
            if(!currentUser){toast('Sign in to chat','error');return}
            const followers=profileUser.followers||[];
            if(!followers.includes(currentUser.uid)){toast('You must follow this user to message them','error');return}
            window.open(`chat.html?uid=${profileUid}`,'_self');
        }

        function showError(msg){$('#profileName').textContent=msg;$('#mainContent').innerHTML=`<div class="empty-state"><div class="empty-state-icon">⚠️</div><p>${msg}</p></div>`}

        auth.onAuthStateChanged(async u=>{
            if(u){const d=await db.collection('users').doc(u.uid).get();currentUser=d.exists?{uid:u.uid,...d.data()}:{uid:u.uid,username:u.email?.split('@')[0]||'user',email:u.email||'',accentColor:userColor(u.email?.split('@')[0]||'user'),emoji:'👤'}}
            else currentUser=null;
            renderAuthUI();
        });

        document.addEventListener('DOMContentLoaded',()=>{
            const t=localStorage.getItem('ls-theme')||'light';setTheme(t);
            $('#themeToggle').addEventListener('click',()=>{const cur=document.body.classList.contains('theme-dark')?'dark':'light';setTheme(cur==='dark'?'light':'dark')});
            renderAuthUI();loadProfile();
            setInterval(async()=>{if(currentUser){const snap=await db.collection('messages').where('participants','array-contains',currentUser.uid).get();let t=0;snap.docs.forEach(d=>{const data=d.data();if(data.unreadCount)t+=data.unreadCount});unreadMsgCount=t;updateMsgBadge()}},15000);
        });
    </script>
</body>
</html>
