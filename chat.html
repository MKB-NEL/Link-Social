        .app{display:flex;flex-direction:column;height:100%;max-width:1200px;margin:0 auto;width:100%;border-left:1px solid var(--b);border-right:1px solid var(--b);background:var(--s)}

        .input-area{padding:0.5rem 0.8rem;border-top:1px solid var(--b);display:flex;gap:0.4rem;align-items:flex-end;background:var(--s);flex-shrink:0;position:relative}
        .input-wrap{flex:1;display:flex;flex-direction:column;background:var(--inp);border-radius:var(--rx);padding:0.3rem 0.6rem;border:1px solid transparent;transition:all var(--t)}
        .input-wrap:focus-within{border-color:var(--p);background:var(--s)}
        .reply-bar{display:none;align-items:center;gap:0.3rem;padding:0.1rem 0;font-size:0.65rem;color:var(--t2);border-bottom:1px solid var(--bl);margin-bottom:0.1rem}
        .reply-bar.show{display:flex}
        .reply-bar-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .reply-bar-close{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t3);font-size:0.65rem}
        .reply-bar-close:hover{background:var(--h);color:var(--da)}
        .input-wrap textarea{flex:1;border:none;background:transparent;outline:none;resize:none;font-size:0.85rem;color:var(--t1);font-family:var(--font);max-height:70px;line-height:1.4;padding:0.05rem 0}
        .emoji-btn{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t3);transition:all var(--t);font-size:1rem;flex-shrink:0}
        .emoji-btn:hover{background:var(--h);color:var(--p)}
        .send-btn{width:34px;height:34px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--t);flex-shrink:0}
        .send-btn:hover{background:var(--ph);transform:scale(1.05)}
        .send-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}

        .emoji-picker{position:absolute;bottom:60px;right:0.8rem;background:var(--s);border:1px solid var(--b);border-radius:var(--rx);padding:0.5rem;box-shadow:0 8px 30px rgba(0,0,0,0.15);z-index:60;display:none;width:280px;max-height:220px;overflow-y:auto}
        .emoji-picker.show{display:block}
        .emoji-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:0.15rem}
        .emoji-item{font-size:1.15rem;cursor:pointer;padding:0.2rem;text-align:center;border-radius:var(--rs);transition:all var(--t)}
        .emoji-item:hover{background:var(--pl);transform:scale(1.2)}

        .placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--t3);padding:2rem}
        .placeholder-icon{font-size:3rem;margin-bottom:0.75rem;opacity:0.4}
        .btn{display:inline-flex;align-items:center;gap:0.25rem;padding:0.35rem 0.8rem;border-radius:var(--rf);font-weight:600;font-size:0.85rem;transition:all var(--t);white-space:nowrap;cursor:pointer;border:none;font-family:var(--font)}
        .btn-primary{background:var(--p);color:#fff}.btn-primary:hover{background:var(--ph)}
        .btn-outline{background:transparent;color:var(--p);border:1.5px solid var(--p)}.btn-outline:hover{background:var(--pl)}
        .btn-ghost{color:var(--t2);background:transparent}.btn-ghost:hover{background:var(--h)}
        .btn-sm{padding:0.2rem 0.6rem;font-size:0.78rem}
        .btn-icon{width:32px;height:32px;padding:0;border-radius:50%}

        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;visibility:hidden;transition:all 0.2s}
        .modal-overlay.active{opacity:1;visibility:visible}
        .modal{background:var(--s);border-radius:var(--r2x);padding:1.25rem;width:100%;max-width:400px;animation:modalIn 0.2s ease-out}
        .modal h3{font-weight:700;margin-bottom:0.75rem;display:flex;align-items:center;gap:0.4rem;font-size:0.95rem}
        .modal-input{width:100%;padding:0.5rem 0.75rem;border:1.5px solid var(--b);border-radius:var(--rm);font-size:0.85rem;background:var(--inp);color:var(--t1);outline:none;font-family:var(--font);margin-bottom:0.5rem}
        .modal-input:focus{border-color:var(--p)}
        .toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);padding:0.6rem 1rem;border-radius:var(--rm);font-size:0.8rem;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.15);z-index:300;animation:fadeIn 0.2s ease-out}
        .toast.success{background:var(--su);color:#fff}.toast.error{background:var(--da);color:#fff}

        @media(max-width:768px){.cp{width:100%}.cp.hidden{display:none}.ca.hidden{display:none}}
    </style>
</head>
<body class="theme-light">

            </div>
            <div class="ca" id="ca">

                <div id="ac" style="display:none;flex:1;flex-direction:column">
                    <div class="ch">
                        <button class="btn btn-icon btn-ghost" id="backBtn" style="display:none"><span class="iconify" data-icon="ph:arrow-left" data-width="18"></span></button>

                            <button class="btn btn-icon btn-ghost" id="muteBtn" title="Mute"><span class="iconify" data-icon="ph:prohibit" data-width="16"></span></button>
                            <button class="btn btn-icon btn-ghost" id="profileBtn" title="Profile"><span class="iconify" data-icon="ph:user" data-width="16"></span></button>
                        </div>

                    <div class="mw" id="mw"><div class="msgs" id="msgs"></div><button class="scroll-btn" id="scrollBtn" onclick="scrollToBottom()"><span class="iconify" data-icon="ph:arrow-down" data-width="16"></span></button></div>
                    <div class="input-area" id="inputArea">
                        <div class="emoji-picker" id="emojiPicker"><div class="emoji-grid" id="emojiGrid"></div></div>
                        <div class="input-wrap">
                            <div class="reply-bar" id="replyBar"><span class="iconify" data-icon="ph:arrow-bend-up-left" data-width="12"></span><span class="reply-bar-text" id="replyText"></span><button class="reply-bar-close" onclick="cancelReply()"><span class="iconify" data-icon="ph:x" data-width="10"></span></button></div>
                            <textarea id="msgInput" placeholder="Message..." rows="1" oninput="autoResize(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>

    <script>
        var firebaseConfig={apiKey:"AIzaSyBbrRHlakmOdKwuDGwYAx5qf-e6DOHW7s0",authDomain:"joefootball-15e7a.firebaseapp.com",databaseURL:"https://joefootball-15e7a-default-rtdb.firebaseio.com",projectId:"joefootball-15e7a",storageBucket:"joefootball-15e7a.firebasestorage.app",messagingSenderId:"976347287101",appId:"1:976347287101:web:93a93c519fff7e60986454",measurementId:"G-3Q10KV3HE3"};
        firebase.initializeApp(firebaseConfig);var db=firebase.firestore();var auth=firebase.auth();

        var $=function(s){return document.querySelector(s)};
        var esc=function(s){if(!s)return'';return String(s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})};
        var timeAgo=function(t){if(!t)return'';var s=Math.floor((Date.now()-t)/1000);if(s<60)return'now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d'};
        var uColor=function(u){var h=0;for(var i=0;i<(u||'a').length;i++)h=u.charCodeAt(i)+((h<<5)-h);return'hsl('+Math.abs(h%360)+',50%,45%)'};
        var ftime=function(t){var d=new Date(t);var h=d.getHours(),m=d.getMinutes(),a=h>=12?'PM':'AM';h=h%12||12;m=m<10?'0'+m:m;return h+':'+m+' '+a};
        var fdate=function(t){var d=new Date(t),today=new Date();if(d.toDateString()===today.toDateString())return'Today';var y=new Date(today);y.setDate(y.getDate()-1);if(d.toDateString()===y.toDateString())return'Yesterday';return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})};

        var user=null,convs=[],activeUid=null,activeUser=null,listener=null,blocked=[],replying=null,editingId=null;
        var EMOJIS='😀😃😄😁😅😂🤣😊😇🙂😉😍🥰😘😋😛😜🤪😎🤓😕😮😯😲😳🥺😢😭😤😡🤬💀👻👽🤖🎉👍👎👏🙌💪🤝❤️🔥⭐💯✅❌⚡📌🔗🛡️🏆💬📢🔔🚀💻📱🎮🎵📚🍕☕🎬'.split('');
        var msgSound=document.getElementById('msgSound');

        function toast(m,t){t=t||'success';var el=document.createElement('div');el.className='toast '+t;el.textContent=m;document.body.appendChild(el);setTimeout(function(){el.style.opacity='0';setTimeout(function(){el.remove()},300)},2000)}
        function setTheme(t){document.body.className='theme-'+t;$('#themeIcon').setAttribute('data-icon',t==='dark'?'ph:sun':'ph:moon');localStorage.setItem('ls-theme',t)}
        function scrollToBottom(){var w=$('#mw');if(w){w.scrollTop=w.scrollHeight;$('#scrollBtn').classList.remove('show')}}
        function checkScroll(){var w=$('#mw');if(!w)return;w.scrollHeight-w.scrollTop-w.clientHeight>200?$('#scrollBtn').classList.add('show'):$('#scrollBtn').classList.remove('show')}
        function autoResize(e){e.style.height='auto';e.style.height=Math.min(e.scrollHeight,70)+'px';$('#sendBtn').disabled=!e.value.trim()}

        function playMsgSound(){if(msgSound){msgSound.currentTime=0;msgSound.play().catch(function(){})}}

        function renderEmojiPicker(){var h='';EMOJIS.forEach(function(e){h+='<span class="emoji-item" onclick="insertEmoji(\''+e+'\')">'+e+'</span>'});$('#emojiGrid').innerHTML=h}
        function insertEmoji(e){var inp=$('#msgInput');var s=inp.selectionStart||0;inp.value=inp.value.substring(0,s)+e+inp.value.substring(inp.selectionEnd||s);inp.selectionStart=inp.selectionEnd=s+e.length;inp.focus();autoResize(inp)}
        function startReply(id,text,name){replying={id:id,text:text,sender:name};$('#replyBar').classList.add('show');$('#replyText').textContent='Replying to @'+name;$('#msgInput').focus()}
        function cancelReply(){replying=null;$('#replyBar').classList.remove('show')}
        function openEditModal(id,text){editingId=id;$('#editInput').value=text;$('#editModal').classList.add('active');$('#editInput').focus()}
        function closeEditModal(){editingId=null;$('#editModal').classList.remove('active')}
        async function saveEdit(){var t=$('#editInput').value.trim();if(!t||!editingId||!activeUid)return;var cid=[user.uid,activeUid].sort().join('_');await db.collection('messages').doc(cid).collection('messages').doc(editingId).update({text:t,edited:true});closeEditModal();toast('Updated')}
        async function deleteMsg(id){if(!confirm('Delete?'))return;var cid=[user.uid,activeUid].sort().join('_');await db.collection('messages').doc(cid).collection('messages').doc(id).delete();toast('Deleted')}

        async function loadBlocked(){if(!user)return;var s=await db.collection('users').doc(user.uid).collection('blocked').get();blocked=s.docs.map(function(d){return d.id})}
        async function ensureConv(cid,oid,oname,sname){var ref=db.collection('messages').doc(cid);var ds=await ref.get();if(!ds.exists){await ref.set({participants:[user.uid,oid],participantNames:(function(){var o={};o[user.uid]=sname||user.username||'User';o[oid]=oname||'User';return o})(),lastMessage:'',lastMessageAt:Date.now(),unreadCount:0})}return ref}

        async function loadConvs(){if(!user)return;await loadBlocked();var q=db.collection('messages').where('participants','array-contains',user.uid).orderBy('lastMessageAt','desc');var s=await q.get();convs=s.docs.map(function(d){return{id:d.id,data:d.data()}});renderConvList(convs)}
        function filterConvs(){var q=$('#cpSearch').value.toLowerCase().trim();renderConvList(q?convs.filter(function(c){var oid=c.data.participants.find(function(p){return p!==user.uid});return((c.data.participantNames||{})[oid]||'').toLowerCase().indexOf(q)!==-1}):convs)}
        function renderConvList(list){var c=$('#cpList');if(!list.length){c.innerHTML='<div class="placeholder"><div class="placeholder-icon"><span class="iconify" data-icon="ph:chat-circle" data-width="40"></span></div><p style="font-weight:600">No conversations</p></div>';return}var h='';list.forEach(function(cv){var oid=cv.data.participants.find(function(p){return p!==user.uid}),oname=(cv.data.participantNames||{})[oid]||'User',isBlocked=blocked.indexOf(oid)!==-1,unread=cv.data.unreadCount||0;h+='<div class="cp-i'+(activeUid===oid?' active':'')+'" onclick="openChat(\''+oid+'\')"><div class="cp-a" style="background:'+uColor(oname)+'">'+(oname||'U')[0].toUpperCase()+'</div><div class="cp-info"><div class="cp-name">'+esc(oname)+(isBlocked?' <span style="color:var(--da);font-size:0.6rem">(muted)</span>':'')+'</div><div class="cp-prev">'+(isBlocked?'Muted':esc(cv.data.lastMessage||'No messages'))+'</div></div><div class="cp-meta"><div class="cp-time">'+timeAgo(cv.data.lastMessageAt)+'</div>'+(unread>0&&!isBlocked?'<div class="cp-badge">'+(unread>9?'9+':unread)+'</div>':'')+'</div></div>'});c.innerHTML=h;window.Iconify.scan(c)}

        async function loadFollowing(){if(!user)return;var d=await db.collection('users').doc(user.uid).get();if(d.exists)user.followingList=d.data().following||[]}
        function isFollowing(uid){return user&&user.followingList&&user.followingList.indexOf(uid)!==-1}

        async function openChat(uid){if(!user||!uid||activeUid===uid)return;if(listener){listener();listener=null}activeUid=uid;var ds=await db.collection('users').doc(uid).get();activeUser=ds.exists?ds.data():{username:'User',uid:uid};activeUser.uid=uid;var following=isFollowing(uid),isBlocked=blocked.indexOf(uid)!==-1;renderActive(following,isBlocked);if(following&&!isBlocked)listenMessages();if(following)markRead();renderConvList(convs);cancelReply();setTimeout(scrollToBottom,100);if(window.innerWidth<=768){$('#cp').classList.add('hidden');$('#ca').classList.remove('hidden');$('#backBtn').style.display='flex'}}

        function renderActive(following,isBlocked){$('#ph').style.display='none';$('#ac').style.display='flex';var a=$('#chAvatar');a.style.background=activeUser.accentColor||uColor(activeUser.username);a.textContent=(activeUser.emoji||(activeUser.username||'U')[0].toUpperCase());$('#chName').textContent=activeUser.username||'User';$('#chUser').textContent='@'+(activeUser.username||'user');$('#profileBtn').onclick=function(){window.open('profile.html?uid='+activeUid,'_self')};$('#muteBtn').onclick=toggleMute;$('#muteBtn').innerHTML=isBlocked?'<span class="iconify" data-icon="ph:prohibit-inset" data-width="16" style="color:var(--da)"></span>':'<span class="iconify" data-icon="ph:prohibit" data-width="16"></span>';$('#msgInput').value='';$('#sendBtn').disabled=true;if(!following){$('#inputArea').style.display='none';$('#msgs').innerHTML='<div class="placeholder"><div class="placeholder-icon"><span class="iconify" data-icon="ph:user-plus" data-width="40"></span></div><h3>Follow to chat</h3><p>Follow @'+(activeUser.username||'user')+' to send messages.</p><button class="btn btn-primary btn-sm" onclick="followAndChat()"><span class="iconify" data-icon="ph:user-plus" data-width="14"></span> Follow & Chat</button></div>'}else if(isBlocked){$('#inputArea').style.display='none';$('#msgs').innerHTML='<div class="placeholder"><div class="placeholder-icon"><span class="iconify" data-icon="ph:prohibit" data-width="40"></span></div><h3>Muted</h3><p>You muted @'+(activeUser.username||'user')+'.</p><button class="btn btn-outline btn-sm" onclick="toggleMute()">Unmute</button></div>'}else{$('#inputArea').style.display='flex';$('#msgs').innerHTML=''}}

        async function followAndChat(){if(!user||!activeUid)return;var meRef=db.collection('users').doc(user.uid),meDoc=await meRef.get();var mf=meDoc.exists?meDoc.data().following||[]:[];if(mf.indexOf(activeUid)===-1)mf.push(activeUid);await meRef.update({following:mf});var tRef=db.collection('users').doc(activeUid),tDoc=await tRef.get();var tf=tDoc.exists?tDoc.data().followers||[]:[];if(tf.indexOf(user.uid)===-1)tf.push(user.uid);await tRef.update({followers:tf});if(!user.followingList)user.followingList=[];user.followingList.push(activeUid);toast('Following!');renderActive(true,blocked.indexOf(activeUid)!==-1);listenMessages()}

        async function toggleMute(){if(!user||!activeUid)return;var idx=blocked.indexOf(activeUid);if(idx!==-1){blocked.splice(idx,1);await db.collection('users').doc(user.uid).collection('blocked').doc(activeUid).delete();toast('Unmuted')}else{blocked.push(activeUid);await db.collection('users').doc(user.uid).collection('blocked').doc(activeUid).set({blockedAt:Date.now()});toast('Muted');if(listener){listener();listener=null}}renderActive(true,blocked.indexOf(activeUid)!==-1);renderConvList(convs)}

        function listenMessages(){if(blocked.indexOf(activeUid)!==-1)return;var cid=[user.uid,activeUid].sort().join('_');
            listener=db.collection('messages').doc(cid).collection('messages').orderBy('timestamp','asc').onSnapshot(function(snap){
                var msgs=[];snap.docChanges().forEach(function(change){
                    if(change.type==='added'){
                        var m=change.doc.data();m.id=change.doc.id;
                        if(m.senderId!==user.uid){playMsgSound();showBrowserNotification(m)}
                    }
                });
                snap.docs.forEach(function(d){var m=d.data();m.id=d.id;msgs.push(m)});
                renderMessages(msgs);
            });
        }

        function showBrowserNotification(m){if(Notification&&Notification.permission==='granted'){var name=m.senderName||activeUser.username||'User';var body=m.text||'';if(body.length>120)body=body.substring(0,117)+'...';try{new Notification('New message from @'+name,{body:body,icon:'/favicon.png',badge:'/favicon.png'})}catch(e){}}}

        function renderMessages(msgs){var c=$('#msgs');if(!c||c.querySelector('.placeholder'))return;var wasNearBottom=$('#mw').scrollHeight-$('#mw').scrollTop-$('#mw').clientHeight<200;var h='',lastDate='';msgs.forEach(function(m){var date=fdate(m.timestamp);if(date!==lastDate){h+='<div class="md"><span>'+date+'</span></div>';lastDate=date}var isSent=m.senderId===user.uid;var text=esc(m.text);var urlMatch=text.match(/(https?:\/\/[^\s]+)/);if(urlMatch){var url=urlMatch[1];var domain='';try{domain=new URL(url).hostname.replace('www.','')}catch(e){}text=text.replace(url,'<a href="'+url+'" target="_blank" class="link">'+domain+'</a>')}var rp=m.replyTo?'<div class="reply-prev">↳ '+esc((m.replyTo.text||'').substring(0,50))+'</div>':'';h+='<div class="mw-wrap '+(isSent?'sent':'received')+'"><div class="mw-actions">'+(isSent?'<button class="mw-btn" title="Edit" onclick="openEditModal(\''+m.id+'\',\''+esc(m.text)+'\')"><span class="iconify" data-icon="ph:pencil-simple" data-width="13"></span></button><button class="mw-btn" title="Delete" onclick="deleteMsg(\''+m.id+'\')"><span class="iconify" data-icon="ph:trash" data-width="13"></span></button>':'')+'<button class="mw-btn" title="Reply" onclick="startReply(\''+m.id+'\',\''+esc((m.text||'').substring(0,40))+'\',\''+esc(m.senderName||'User')+'\')"><span class="iconify" data-icon="ph:arrow-bend-up-left" data-width="13"></span></button></div>'+rp+'<div class="bubble '+(isSent?'sent':'received')+(m.edited?' edited':'')+'"><span>'+text+'</span>'+(m.edited?'<div style="font-size:0.5rem;opacity:0.5;margin-top:0.1rem;text-align:right">edited</div>':'')+'<div class="b-time">'+ftime(m.timestamp)+'</div></div></div>'});c.innerHTML=h;window.Iconify.scan(c);if(wasNearBottom){$('#mw').scrollTop=$('#mw').scrollHeight}else{checkScroll()}}

        async function sendMessage(){var text=$('#msgInput').value.trim();if(!text||!activeUid||!user)return;if(blocked.indexOf(activeUid)!==-1){toast('Unmute to send','error');return}var cid=[user.uid,activeUid].sort().join('_');var msg={senderId:user.uid,text:text,timestamp:Date.now(),senderName:user.username||'User'};if(replying){msg.replyTo={id:replying.id,text:replying.text,sender:replying.sender};cancelReply()}await ensureConv(cid,activeUid,activeUser.username||'User',user.username||'User');await db.collection('messages').doc(cid).collection('messages').add(msg);await db.collection('messages').doc(cid).set({participants:[user.uid,activeUid],participantNames:(function(){var o={};o[user.uid]=user.username||'User';o[activeUid]=activeUser.username||'User';return o})(),lastMessage:text,lastMessageAt:Date.now(),unreadCount:firebase.firestore.FieldValue.increment(1)},{merge:true});$('#msgInput').value='';$('#sendBtn').disabled=true;$('#msgInput').style.height='auto';loadConvs();setTimeout(function(){var w=$('#mw');if(w)w.scrollTop=w.scrollHeight},100)}

        async function markRead(){if(!activeUid||!user)return;var cid=[user.uid,activeUid].sort().join('_');var ref=db.collection('messages').doc(cid);var ds=await ref.get();if(ds.exists)await ref.update({unreadCount:0});loadConvs()}
        function backToConvs(){$('#cp').classList.remove('hidden');$('#ca').classList.add('hidden');$('#ac').style.display='none';$('#ph').style.display='flex';if(listener){listener();listener=null}activeUid=null;activeUser=null}
        function viewProfile(){if(activeUid)window.open('profile.html?uid='+activeUid,'_self')}
        function requestNotification(){if(Notification&&Notification.permission==='default'){Notification.requestPermission()}}

        auth.onAuthStateChanged(async function(u){
            if(u){var d=await db.collection('users').doc(u.uid).get();user=d.exists?Object.assign({uid:u.uid},d.data()):{uid:u.uid,username:u.email.split('@')[0],accentColor:uColor(u.email.split('@')[0]),emoji:'👤'};await loadFollowing()}else{window.location.href='index.html';return}
            loadConvs();var target=new URLSearchParams(location.search).get('uid');if(target&&target!==user.uid)openChat(target);
        });

        document.addEventListener('DOMContentLoaded',function(){
            var t=localStorage.getItem('ls-theme')||'light';setTheme(t);
            $('#themeToggle').onclick=function(){setTheme(document.body.className.indexOf('dark')!==-1?'light':'dark')};
            $('#backBtn').onclick=backToConvs;
            $('#emojiToggle').onclick=function(e){e.stopPropagation();$('#emojiPicker').classList.toggle('show')};
            document.addEventListener('click',function(e){if(!e.target.closest('#emojiPicker')&&!e.target.closest('#emojiToggle'))$('#emojiPicker').classList.remove('show')});
            renderEmojiPicker();requestNotification();
            $('#mw').addEventListener('scroll',checkScroll);
            $('#saveEdit').onclick=saveEdit;$('#cancelEdit').onclick=closeEditModal;
            $('#editModal').addEventListener('click',function(e){if(e.target===$('#editModal'))closeEditModal()});
            if(window.innerWidth<=768){$('#backBtn').style.display='flex'}
            window.addEventListener('resize',function(){if(window.innerWidth<=768){$('#backBtn').style.display='flex'}else{$('#backBtn').style.display='none';$('#cp').classList.remove('hidden');$('#ca').classList.remove('hidden')}});
        });
    </script>
</body>
</html>
