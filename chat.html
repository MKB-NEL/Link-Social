<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        :root {
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --transition: 150ms cubic-bezier(0.4,0,0.2,1);
            --radius-sm: 0.375rem; --radius-md: 0.5rem; --radius-lg: 0.75rem; --radius-xl: 1rem; --radius-2xl: 1.5rem; --radius-full: 9999px;
        }
        .theme-light {
            --bg: #f4f2ee; --surface: #ffffff; --hover: #f9fafb; --input: #eef3f8;
            --border: #e5e7eb; --border-light: #f0f0f0; --text: #191919; --text-secondary: #595856; --text-tertiary: #868482;
            --primary: #6c47ff; --primary-hover: #5835e8; --primary-light: #f0ebff; --secondary: #3b82f6;
            --success: #057642; --danger: #d11124; --msg-sent: #6c47ff; --msg-received: #f9fafb;
            --logo: url('https://i.ibb.co/Z67LrCG7/L-1.png');
        }
        .theme-dark {
            --bg: #1a1a2e; --surface: #16213e; --hover: #1a2744; --input: #0f3460;
            --border: #2a3a5e; --border-light: #1e2d4a; --text: #e8e8e8; --text-secondary: #b0b0b0; --text-tertiary: #8a8a8a;
            --primary: #8b6cff; --primary-hover: #7b5ce8; --primary-light: #1e1a3a; --secondary: #60a5fa;
            --success: #22c55e; --danger: #ef4444; --msg-sent: #8b6cff; --msg-received: #263348;
            --logo: url('https://i.ibb.co/jPxVQH4X/L-2.png');
        }
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        html,body{height:100%;overflow:hidden}
        body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5;transition:background 0.3s,color 0.3s;display:flex;flex-direction:column}
        a{color:inherit;text-decoration:none}
        button{font-family:inherit;cursor:pointer;border:none;background:none}
        ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
        @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        @keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
        @keyframes spin{to{transform:rotate(360deg)}}

        .app{display:flex;flex-direction:column;height:100%;max-width:1200px;margin:0 auto;width:100%;border-left:1px solid var(--border);border-right:1px solid var(--border);background:var(--surface)}

        .nav{display:flex;align-items:center;justify-content:space-between;padding:0.6rem 1.25rem;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
        .nav-left{display:flex;align-items:center;gap:0.5rem}
        .nav-back{display:flex;align-items:center;gap:0.3rem;color:var(--text-secondary);font-weight:600;font-size:0.85rem;padding:0.3rem 0.5rem;border-radius:var(--radius-full);transition:all var(--transition)}
        .nav-back:hover{background:var(--hover);color:var(--primary)}
        .nav-logo{width:30px;height:30px;background-image:var(--logo);background-size:contain;background-repeat:no-repeat;background-position:center;border-radius:var(--radius-sm)}
        .nav-title{font-weight:700;font-size:1rem}
        .nav-actions{display:flex;align-items:center;gap:0.3rem}

        .layout{display:flex;flex:1;overflow:hidden}
        .conv-panel{width:340px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--surface)}
        .conv-header{padding:0.8rem 1rem;border-bottom:1px solid var(--border);font-weight:700;font-size:0.9rem;display:flex;align-items:center;gap:0.4rem;flex-shrink:0}
        .conv-search{margin:0.5rem;flex-shrink:0}
        .conv-search input{width:100%;padding:0.5rem 0.75rem;background:var(--input);border:1px solid transparent;border-radius:var(--radius-lg);font-size:0.8rem;color:var(--text);outline:none;transition:all var(--transition)}
        .conv-search input:focus{border-color:var(--primary);background:var(--surface)}
        .conv-list{flex:1;overflow-y:auto}
        .conv-item{display:flex;align-items:center;gap:0.6rem;padding:0.7rem 1rem;cursor:pointer;transition:all var(--transition);border-left:3px solid transparent}
        .conv-item:hover{background:var(--hover)}
        .conv-item.active{background:var(--primary-light);border-left-color:var(--primary)}
        .conv-avatar{width:42px;height:42px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:0.8rem;flex-shrink:0}
        .conv-info{flex:1;min-width:0}
        .conv-name{font-weight:600;font-size:0.85rem;display:flex;align-items:center;gap:0.3rem}
        .conv-preview{font-size:0.75rem;color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .conv-meta{text-align:right;flex-shrink:0}
        .conv-time{font-size:0.65rem;color:var(--text-tertiary)}
        .conv-badge{display:inline-flex;align-items:center;justify-content:center;background:var(--primary);color:#fff;font-size:0.6rem;min-width:16px;height:16px;border-radius:var(--radius-full);padding:0 4px;margin-top:0.2rem}

        .chat-area{flex:1;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
        .chat-header{padding:0.65rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:0.6rem;background:var(--surface);flex-shrink:0}
        .chat-header-avatar{width:36px;height:36px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:0.75rem;flex-shrink:0;cursor:pointer}
        .chat-header-name{font-weight:600;font-size:0.85rem}
        .chat-header-username{font-size:0.7rem;color:var(--text-tertiary)}
        .chat-header-actions{margin-left:auto;display:flex;gap:0.15rem}

        .messages-wrap{flex:1;overflow-y:auto;position:relative}
        .messages{padding:1rem;display:flex;flex-direction:column;gap:0.3rem}
        .msg-date{text-align:center;font-size:0.68rem;color:var(--text-tertiary);margin:0.6rem 0}
        .msg-date span{background:var(--bg);padding:0.2rem 0.65rem;border-radius:var(--radius-full);border:1px solid var(--border-light)}
        .msg-wrapper{display:flex;flex-direction:column;position:relative}
        .msg-wrapper.sent{align-items:flex-end}.msg-wrapper.received{align-items:flex-start}
        .msg-actions{display:none;gap:0.1rem;position:absolute;top:-24px;z-index:5;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:0.1rem 0.2rem;box-shadow:0 2px 8px rgba(0,0,0,0.1);white-space:nowrap}
        .msg-wrapper:hover .msg-actions{display:flex}
        .msg-wrapper.sent .msg-actions{right:0}.msg-wrapper.received .msg-actions{left:0}
        .msg-action{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-tertiary);transition:all var(--transition)}
        .msg-action:hover{background:var(--primary-light);color:var(--primary)}
        .msg-bubble{max-width:70%;padding:0.55rem 0.8rem;border-radius:var(--radius-xl);font-size:0.85rem;line-height:1.4;animation:fadeIn 0.2s ease-out;word-break:break-word}
        .msg-bubble.sent{background:var(--msg-sent);color:#fff;border-bottom-right-radius:var(--radius-sm)}
        .msg-bubble.received{background:var(--msg-received);color:var(--text);border-bottom-left-radius:var(--radius-sm)}
        .msg-time{font-size:0.55rem;opacity:0.7;margin-top:0.15rem;text-align:right}
        .msg-reply-preview{background:rgba(0,0,0,0.05);border-left:2px solid var(--primary);padding:0.2rem 0.4rem;border-radius:var(--radius-sm);margin-bottom:0.2rem;font-size:0.7rem;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
        .msg-link-card{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-top:0.4rem;max-width:260px;background:var(--surface)}
        .msg-link-card img{width:100%;height:100px;object-fit:cover}
        .msg-link-card-body{padding:0.4rem 0.6rem}
        .msg-link-domain{font-size:0.6rem;color:var(--primary);text-transform:uppercase;font-weight:600}
        .msg-link-title{font-size:0.75rem;font-weight:600;line-height:1.3}

        .scroll-btn{position:absolute;bottom:0.75rem;right:1rem;width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,0.1);display:none;align-items:center;justify-content:center;cursor:pointer;z-index:10;color:var(--text-secondary);transition:all var(--transition)}
        .scroll-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
        .scroll-btn.show{display:flex}

        .input-area{padding:0.5rem 0.85rem;border-top:1px solid var(--border);display:flex;gap:0.4rem;align-items:flex-end;background:var(--surface);flex-shrink:0;position:relative}
        .input-wrap{flex:1;display:flex;flex-direction:column;background:var(--input);border-radius:var(--radius-xl);padding:0.3rem 0.6rem;border:1px solid transparent;transition:all var(--transition)}
        .input-wrap:focus-within{border-color:var(--primary);background:var(--surface)}
        .reply-bar{display:none;align-items:center;gap:0.3rem;padding:0.15rem 0;font-size:0.68rem;color:var(--text-secondary);border-bottom:1px solid var(--border-light);margin-bottom:0.15rem}
        .reply-bar.show{display:flex}
        .reply-bar-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .reply-bar-close{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-tertiary);font-size:0.65rem}
        .reply-bar-close:hover{background:var(--hover);color:var(--danger)}
        .input-wrap textarea{flex:1;border:none;background:transparent;outline:none;resize:none;font-size:0.85rem;color:var(--text);font-family:var(--font);max-height:70px;line-height:1.4;padding:0.08rem 0}
        .emoji-btn{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-tertiary);transition:all var(--transition);font-size:1rem;flex-shrink:0}
        .emoji-btn:hover{background:var(--hover);color:var(--primary)}
        .send-btn{width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--transition);flex-shrink:0}
        .send-btn:hover{background:var(--primary-hover);transform:scale(1.05)}
        .send-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}

        .emoji-picker{position:absolute;bottom:65px;right:0.85rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:0.6rem;box-shadow:0 8px 30px rgba(0,0,0,0.15);z-index:60;display:none;width:300px;max-height:240px;overflow-y:auto}
        .emoji-picker.show{display:block}
        .emoji-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:0.2rem}
        .emoji-item{font-size:1.2rem;cursor:pointer;padding:0.25rem;text-align:center;border-radius:var(--radius-sm);transition:all var(--transition)}
        .emoji-item:hover{background:var(--primary-light);transform:scale(1.2)}

        .placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--text-tertiary);padding:2rem}
        .placeholder-icon{font-size:3rem;margin-bottom:0.75rem;opacity:0.4}

        .btn{display:inline-flex;align-items:center;gap:0.25rem;padding:0.4rem 0.85rem;border-radius:var(--radius-full);font-weight:600;font-size:0.85rem;transition:all var(--transition);white-space:nowrap}
        .btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-hover)}
        .btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}.btn-outline:hover{background:var(--primary-light)}
        .btn-ghost{color:var(--text-secondary)}.btn-ghost:hover{background:var(--hover)}
        .btn-sm{padding:0.25rem 0.65rem;font-size:0.78rem}
        .btn-icon{width:32px;height:32px;padding:0;border-radius:50%}

        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;visibility:hidden;transition:all 0.2s}
        .modal-overlay.active{opacity:1;visibility:visible}
        .modal{background:var(--surface);border-radius:var(--radius-2xl);padding:1.25rem;width:100%;max-width:400px;animation:modalIn 0.2s ease-out}
        .modal h3{font-weight:700;margin-bottom:0.75rem;display:flex;align-items:center;gap:0.4rem;font-size:0.95rem}
        .modal-input{width:100%;padding:0.5rem 0.75rem;border:1.5px solid var(--border);border-radius:var(--radius-md);font-size:0.85rem;background:var(--input);color:var(--text);outline:none;font-family:var(--font);margin-bottom:0.5rem}
        .modal-input:focus{border-color:var(--primary)}
        .toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);padding:0.65rem 1rem;border-radius:var(--radius-md);font-size:0.8rem;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.15);z-index:300;animation:fadeIn 0.2s ease-out}
        .toast.success{background:var(--success);color:#fff}.toast.error{background:var(--danger);color:#fff}

        @media(max-width:768px){.conv-panel{width:100%}.conv-panel.hidden{display:none}.chat-area.hidden{display:none}}
    </style>
</head>
<body class="theme-light">
    <div class="app">
        <nav class="nav">
            <div class="nav-left">
                <a class="nav-back" href="index.html"><span class="iconify" data-icon="ph:arrow-left" data-width="16"></span> Feed</a>

        <div class="layout">

                <div class="conv-search"><input type="text" id="convSearch" placeholder="Search..." oninput="filterConvs()"></div>
                <div class="conv-list" id="convList"></div>
                <div style="padding:0.5rem;border-top:1px solid var(--border);text-align:center;font-size:0.6rem;color:var(--text-tertiary)"><a href="https://pireactive.vercel.app" target="_blank" style="color:var(--primary)">LinkSocial © 2026 · Built by PIReactive</a></div>
            </div>

                <div id="activeChat" style="display:none;flex:1;flex-direction:column">
                    <div class="chat-header">
                        <button class="btn btn-icon btn-ghost" id="backBtn" style="display:none"><span class="iconify" data-icon="ph:arrow-left" data-width="18"></span></button>
                        <div class="chat-header-avatar" id="chatAvatar" onclick="viewProfile()">U</div>
                        <div><div class="chat-header-name" id="chatName">User</div><div class="chat-header-username" id="chatUsername">@user</div></div>

                            <button class="btn btn-icon btn-ghost" id="profileBtn" title="Profile"><span class="iconify" data-icon="ph:user" data-width="16"></span></button>

                    </div>
                    <div class="messages-wrap" id="messagesWrap"><div class="messages" id="messages"></div><button class="scroll-btn" id="scrollBtn" onclick="scrollToBottom()"><span class="iconify" data-icon="ph:arrow-down" data-width="16"></span></button></div>

                        <div class="emoji-picker" id="emojiPicker"><div class="emoji-grid" id="emojiGrid"></div></div>
                        <div class="input-wrap">
                            <div class="reply-bar" id="replyBar"><span class="iconify" data-icon="ph:arrow-bend-up-left" data-width="12"></span><span class="reply-bar-text" id="replyText"></span><button class="reply-bar-close" onclick="cancelReply()"><span class="iconify" data-icon="ph:x" data-width="10"></span></button></div>
                            <textarea id="msgInput" placeholder="Message..." rows="1" oninput="autoResize(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>

                        <button class="emoji-btn" id="emojiToggle"><span class="iconify" data-icon="ph:smiley" data-width="18"></span></button>
                        <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled><span class="iconify" data-icon="ph:paper-plane-right" data-width="16"></span></button>

                </div>
            </div>
        </div>

    <script>
        const firebaseConfig={apiKey:"AIzaSyBbrRHlakmOdKwuDGwYAx5qf-e6DOHW7s0",authDomain:"joefootball-15e7a.firebaseapp.com",databaseURL:"https://joefootball-15e7a-default-rtdb.firebaseio.com",projectId:"joefootball-15e7a",storageBucket:"joefootball-15e7a.firebasestorage.app",messagingSenderId:"976347287101",appId:"1:976347287101:web:93a93c519fff7e60986454",measurementId:"G-3Q10KV3HE3"};
        firebase.initializeApp(firebaseConfig);const db=firebase.firestore();const auth=firebase.auth();

        const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
        const esc=s=>s?String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])):'';
        const timeAgo=t=>{if(!t)return'';const s=Math.floor((Date.now()-t)/1000);if(s<60)return'now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d';};
        const color=u=>{let h=0;for(let i=0;i<(u||'a').length;i++)h=u.charCodeAt(i)+((h<<5)-h);return`hsl(${Math.abs(h%360)},50%,45%)`};
        const ftime=t=>{const d=new Date(t);let h=d.getHours(),m=d.getMinutes();const am=h>=12?'PM':'AM';h=h%12||12;m=m<10?'0'+m:m;return`${h}:${m} ${am}`};
        const fdate=t=>{const d=new Date(t),today=new Date();if(d.toDateString()===today.toDateString())return'Today';const y=new Date(today);y.setDate(y.getDate()-1);if(d.toDateString()===y.toDateString())return'Yesterday';return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})};

        let user=null,convs=[],activeUid=null,activeUser=null,listener=null,blocked=[],replying=null,editingId=null;
        const EMOJIS='😀😃😄😁😅😂🤣😊😇🙂😉😍🥰😘😋😛😜🤪😎🤓😕😮😯😲😳🥺😢😭😤😡🤬💀👻👽🤖🎉👍👎👏🙌💪🤝❤️🔥⭐💯✅❌⚡📌🔗🛡️🏆💬📢🔔🚀💻📱🎮🎵📚🍕☕🎬'.split('');

        function toast(m,t='success'){const el=document.createElement('div');el.className=`toast ${t}`;el.textContent=m;document.body.appendChild(el);setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),300)},2000)}
        function setTheme(t){document.body.className='theme-'+t;$('#themeIcon').setAttribute('data-icon',t==='dark'?'ph:sun':'ph:moon');localStorage.setItem('ls-theme',t)}
        function scrollToBottom(){const w=$('#messagesWrap');w.scrollTop=w.scrollHeight;$('#scrollBtn').classList.remove('show')}
        function checkScroll(){const w=$('#messagesWrap');if(!w)return;w.scrollHeight-w.scrollTop-w.clientHeight>200?$('#scrollBtn').classList.add('show'):$('#scrollBtn').classList.remove('show')}
        function autoResize(e){e.style.height='auto';e.style.height=Math.min(e.scrollHeight,70)+'px';$('#sendBtn').disabled=!e.value.trim()}

        function renderEmojiPicker(){let h='';EMOJIS.forEach(e=>h+=`<span class="emoji-item" onclick="insertEmoji('${e}')">${e}</span>`);$('#emojiGrid').innerHTML=h}
        function insertEmoji(e){const inp=$('#msgInput');const s=inp.selectionStart||0;inp.value=inp.value.slice(0,s)+e+inp.value.slice(inp.selectionEnd||s);inp.selectionStart=inp.selectionEnd=s+e.length;inp.focus();autoResize(inp)}
        function startReply(id,text,name){replying={id,text,sender:name};$('#replyBar').classList.add('show');$('#replyText').textContent=`Replying to @${name}`;$('#msgInput').focus()}
        function cancelReply(){replying=null;$('#replyBar').classList.remove('show')}
        function openEditModal(id,text){editingId=id;$('#editInput').value=text;$('#editModal').classList.add('active');$('#editInput').focus()}
        function closeEditModal(){editingId=null;$('#editModal').classList.remove('active')}
        async function saveEdit(){const t=$('#editInput').value.trim();if(!t||!editingId||!activeUid)return;const cid=[user.uid,activeUid].sort().join('_');await db.collection('messages').doc(cid).collection('messages').doc(editingId).update({text:t,edited:true});closeEditModal();toast('Updated')}
        async function deleteMsg(id){if(!confirm('Delete?'))return;const cid=[user.uid,activeUid].sort().join('_');await db.collection('messages').doc(cid).collection('messages').doc(id).delete();toast('Deleted')}

        async function loadBlocked(){if(!user)return;const s=await db.collection('users').doc(user.uid).collection('blocked').get();blocked=s.docs.map(d=>d.id)}
        async function ensureConv(cid,oid,oname,sname){const ref=db.collection('messages').doc(cid);if(!(await ref.get()).exists){await ref.set({participants:[user.uid,oid],participantNames:{[user.uid]:sname||user.username||'User',[oid]:oname||'User'},lastMessage:'',lastMessageAt:Date.now(),unreadCount:0})}return ref}

        async function loadConvs(){if(!user)return;await loadBlocked();const s=await db.collection('messages').where('participants','array-contains',user.uid).orderBy('lastMessageAt','desc').get();convs=s.docs.map(d=>({id:d.id,...d.data()}));renderConvList(convs)}
        function filterConvs(){const q=$('#convSearch').value.toLowerCase().trim();renderConvList(q?convs.filter(c=>{const oid=c.participants.find(p=>p!==user.uid);return((c.participantNames||{})[oid]||'').toLowerCase().includes(q)}):convs)}
        function renderConvList(list){const c=$('#convList');if(!list.length){c.innerHTML='<div class="placeholder"><div class="placeholder-icon"><span class="iconify" data-icon="ph:chat-circle" data-width="40"></span></div><p style="font-weight:600">No conversations</p></div>';return}let h='';list.forEach(cv=>{const oid=cv.participants.find(p=>p!==user.uid),oname=(cv.participantNames||{})[oid]||'User',isBlocked=blocked.includes(oid);h+=`<div class="conv-item${activeUid===oid?' active':''}" onclick="openChat('${oid}')"><div class="conv-avatar" style="background:${color(oname)}">${(oname||'U')[0].toUpperCase()}</div><div class="conv-info"><div class="conv-name">${esc(oname)}${isBlocked?' <span style="color:var(--danger);font-size:0.6rem">(muted)</span>':''}</div><div class="conv-preview">${isBlocked?'Muted':esc(cv.lastMessage||'No messages')}</div></div><div class="conv-meta"><div class="conv-time">${timeAgo(cv.lastMessageAt)}</div>${cv.unreadCount>0&&!isBlocked?`<div class="conv-badge">${cv.unreadCount>9?'9+':cv.unreadCount}</div>`:''}</div></div>`});c.innerHTML=h;window.Iconify.scan(c)}

        async function loadFollowing(){if(!user)return;const d=await db.collection('users').doc(user.uid).get();if(d.exists)user.followingList=d.data().following||[]}
        function isFollowing(uid){return user&&user.followingList&&user.followingList.includes(uid)}

        async function openChat(uid){if(!user||!uid||activeUid===uid)return;if(listener){listener();listener=null}activeUid=uid;const d=await db.collection('users').doc(uid).get();activeUser=d.exists?d.data():{username:'User',uid};activeUser.uid=uid;const following=isFollowing(uid),isBlocked=blocked.includes(uid);renderActive(following,isBlocked);if(following&&!isBlocked)listenMessages();if(following)markRead();renderConvList(convs);cancelReply();scrollToBottom();if(window.innerWidth<=768){$('#convPanel').classList.add('hidden');$('#chatArea').classList.remove('hidden');$('#backBtn').style.display='flex'}}

        function renderActive(following,isBlocked){$('#placeholder').style.display='none';$('#activeChat').style.display='flex';$('#chatAvatar').style.background=activeUser.accentColor||color(activeUser.username);$('#chatAvatar').textContent=(activeUser.emoji||(activeUser.username||'U')[0].toUpperCase());$('#chatName').textContent=activeUser.username||'User';$('#chatUsername').textContent='@'+(activeUser.username||'user');$('#profileBtn').onclick=()=>window.open('profile.html?uid='+activeUid,'_self');$('#muteBtn').onclick=toggleMute;$('#muteBtn').innerHTML=isBlocked?'<span class="iconify" data-icon="ph:prohibit-inset" data-width="16" style="color:var(--danger)"></span>':'<span class="iconify" data-icon="ph:prohibit" data-width="16"></span>';$('#msgInput').value='';$('#sendBtn').disabled=true;if(!following){$('#inputArea').style.display='none';$('#messages').innerHTML=`<div class="placeholder"><div class="placeholder-icon"><span class="iconify" data-icon="ph:user-plus" data-width="40"></span></div><h3>Follow to chat</h3><p>Follow @${activeUser.username||'user'} to send messages.</p><button class="btn btn-primary btn-sm" onclick="followAndChat()"><span class="iconify" data-icon="ph:user-plus" data-width="14"></span> Follow & Chat</button></div>`}else if(isBlocked){$('#inputArea').style.display='none';$('#messages').innerHTML=`<div class="placeholder"><div class="placeholder-icon"><span class="iconify" data-icon="ph:prohibit" data-width="40"></span></div><h3>Muted</h3><p>You muted @${activeUser.username||'user'}.</p><button class="btn btn-outline btn-sm" onclick="toggleMute()">Unmute</button></div>`}else{$('#inputArea').style.display='flex';$('#messages').innerHTML=''}}

        async function followAndChat(){if(!user||!activeUid)return;const meRef=db.collection('users').doc(user.uid),meDoc=await meRef.get();let myFollowing=meDoc.exists?meDoc.data().following||[]:[];if(!myFollowing.includes(activeUid))myFollowing.push(activeUid);await meRef.update({following:myFollowing});const tRef=db.collection('users').doc(activeUid),tDoc=await tRef.get();let tFollowers=tDoc.exists?tDoc.data().followers||[]:[];if(!tFollowers.includes(user.uid))tFollowers.push(user.uid);await tRef.update({followers:tFollowers});if(!user.followingList)user.followingList=[];user.followingList.push(activeUid);toast('Following!');renderActive(true,blocked.includes(activeUid));listenMessages()}

        async function toggleMute(){if(!user||!activeUid)return;const idx=blocked.indexOf(activeUid);if(idx!==-1){blocked.splice(idx,1);await db.collection('users').doc(user.uid).collection('blocked').doc(activeUid).delete();toast('Unmuted')}else{blocked.push(activeUid);await db.collection('users').doc(user.uid).collection('blocked').doc(activeUid).set({blockedAt:Date.now()});toast('Muted');if(listener){listener();listener=null}}renderActive(true,blocked.includes(activeUid));renderConvList(convs)}

        function listenMessages(){if(blocked.includes(activeUid))return;const cid=[user.uid,activeUid].sort().join('_');listener=db.collection('messages').doc(cid).collection('messages').orderBy('timestamp','asc').onSnapshot(snap=>{const msgs=[];snap.docs.forEach(d=>{const m=d.data();m.id=d.id;msgs.push(m)});renderMessages(msgs)})}
        function renderMessages(msgs){const c=$('#messages');if(!c||c.querySelector('.placeholder'))return;const nearBottom=$('#messagesWrap').scrollHeight-$('#messagesWrap').scrollTop-$('#messagesWrap').clientHeight<200;let h='',lastDate='';msgs.forEach(m=>{const date=fdate(m.timestamp);if(date!==lastDate){h+=`<div class="msg-date"><span>${date}</span></div>`;lastDate=date}const isSent=m.senderId===user.uid;let text=esc(m.text);const urlMatch=text.match(/(https?:\/\/[^\s]+)/);let linkCard='';if(urlMatch){const url=urlMatch[1];let domain='';try{domain=new URL(url).hostname.replace('www.','')}catch(e){}text=text.replace(url,`<a href="${url}" target="_blank" class="msg-link">🔗 ${domain}</a>`);linkCard=`<div class="msg-link-card" onclick="window.open('${url}','_blank')"><div class="msg-link-card-body"><div class="msg-link-domain">${domain}</div><div class="msg-link-title">${url}</div></div></div>`}const replyPrev=m.replyTo?`<div class="msg-reply-preview">↳ ${esc((m.replyTo.text||'').substring(0,50))}</div>`:'';h+=`<div class="msg-wrapper ${isSent?'sent':'received'}"><div class="msg-actions">${isSent?`<button class="msg-action" title="Edit" onclick="openEditModal('${m.id}','${esc(m.text)}')"><span class="iconify" data-icon="ph:pencil-simple" data-width="13"></span></button><button class="msg-action" title="Delete" onclick="deleteMsg('${m.id}')"><span class="iconify" data-icon="ph:trash" data-width="13"></span></button>`:''}<button class="msg-action" title="Reply" onclick="startReply('${m.id}','${esc((m.text||'').substring(0,40))}','${esc(m.senderName||'User')}')"><span class="iconify" data-icon="ph:arrow-bend-up-left" data-width="13"></span></button></div>${replyPrev}<div class="msg-bubble ${isSent?'sent':'received'}${m.edited?' edited':''}"><span>${text}</span>${m.edited?'<div style="font-size:0.5rem;opacity:0.5;margin-top:0.1rem;text-align:right">edited</div>':''}${linkCard}<div class="msg-time">${ftime(m.timestamp)}</div></div></div>`});c.innerHTML=h;window.Iconify.scan(c);if(nearBottom)scrollToBottom();checkScroll()}

        async function sendMessage(){const text=$('#msgInput').value.trim();if(!text||!activeUid||!user)return;if(blocked.includes(activeUid)){toast('Unmute to send','error');return}const cid=[user.uid,activeUid].sort().join('_');const msg={senderId:user.uid,text,timestamp:Date.now(),senderName:user.username||'User'};if(replying){msg.replyTo={id:replying.id,text:replying.text,sender:replying.sender};cancelReply()}await ensureConv(cid,activeUid,activeUser.username||'User',user.username||'User');await db.collection('messages').doc(cid).collection('messages').add(msg);await db.collection('messages').doc(cid).set({participants:[user.uid,activeUid],participantNames:{[user.uid]:user.username||'User',[activeUid]:activeUser.username||'User'},lastMessage:text,lastMessageAt:Date.now(),unreadCount:firebase.firestore.FieldValue.increment(1)},{merge:true});$('#msgInput').value='';$('#sendBtn').disabled=true;$('#msgInput').style.height='auto';loadConvs();scrollToBottom()}
        async function markRead(){if(!activeUid||!user)return;const cid=[user.uid,activeUid].sort().join('_');const ref=db.collection('messages').doc(cid);if((await ref.get()).exists)await ref.update({unreadCount:0});loadConvs()}
        function backToConvs(){$('#convPanel').classList.remove('hidden');$('#chatArea').classList.add('hidden');$('#activeChat').style.display='none';$('#placeholder').style.display='flex';if(listener){listener();listener=null}activeUid=null;activeUser=null}
        function viewProfile(){if(activeUid)window.open('profile.html?uid='+activeUid,'_self')}

        auth.onAuthStateChanged(async u=>{if(u){const d=await db.collection('users').doc(u.uid).get();user=d.exists?{uid:u.uid,...d.data()}:{uid:u.uid,username:u.email.split('@')[0],accentColor:color(u.email.split('@')[0]),emoji:'👤'};await loadFollowing()}else{window.location.href='index.html';return}loadConvs();const target=new URLSearchParams(location.search).get('uid');if(target&&target!==user.uid)openChat(target)});

        document.addEventListener('DOMContentLoaded',()=>{const t=localStorage.getItem('ls-theme')||'light';setTheme(t);$('#themeToggle').onclick=()=>setTheme(document.body.className.includes('dark')?'light':'dark');$('#backBtn').onclick=backToConvs;$('#emojiToggle').onclick=e=>{e.stopPropagation();$('#emojiPicker').classList.toggle('show')};document.addEventListener('click',e=>{if(!e.target.closest('#emojiPicker')&&!e.target.closest('#emojiToggle'))$('#emojiPicker').classList.remove('show')});renderEmojiPicker();$('#messagesWrap').addEventListener('scroll',checkScroll);$('#saveEdit').onclick=saveEdit;$('#cancelEdit').onclick=closeEditModal;$('#editModal').addEventListener('click',e=>{if(e.target===$('#editModal'))closeEditModal()});if(window.innerWidth<=768){$('#backBtn').style.display='flex'}window.addEventListener('resize',()=>{if(window.innerWidth<=768){$('#backBtn').style.display='flex'}else{$('#backBtn').style.display='none';$('#convPanel').classList.remove('hidden');$('#chatArea').classList.remove('hidden')}})});
    </script>
</body>
</html>
