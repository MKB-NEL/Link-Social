<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Messages — LinkSocial</title>
    <meta name="description" content="Chat with your LinkSocial connections">
    <meta name="theme-color" content="#6c47ff">
    <meta property="og:title" content="Messages — LinkSocial">
    <meta property="og:image" content="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%236c47ff'/%3E%3Ctext x='50' y='67' font-size='50' text-anchor='middle' fill='white'%3EL%3C/text%3E%3C/svg%3E">
    <link rel="icon" type="image/png" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%236c47ff'/%3E%3Ctext x='50' y='67' font-size='50' text-anchor='middle' fill='white'%3EL%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
    <style>
        :root{--font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Roboto,'Helvetica Neue',Arial,sans-serif;--transition-fast:150ms cubic-bezier(0.4,0,0.2,1);--transition-base:250ms cubic-bezier(0.4,0,0.2,1);--radius-sm:0.375rem;--radius-md:0.5rem;--radius-lg:0.75rem;--radius-xl:1rem;--radius-2xl:1.5rem;--radius-full:9999px}
        .theme-light{--bg-main:#f4f2ee;--bg-surface:#ffffff;--bg-hover:#f9fafb;--bg-input:#eef3f8;--border:#e5e7eb;--border-light:#f0f0f0;--text-primary:#191919;--text-secondary:#595856;--text-tertiary:#868482;--primary:#6c47ff;--primary-hover:#5835e8;--primary-light:#f0ebff;--secondary:#3b82f6;--success:#057642;--warning:#d97706;--danger:#d11124;--msg-sent:var(--primary);--msg-received:var(--bg-hover);--logo-url:url('https://i.ibb.co/Z67LrCG7/L-1.png')}
        .theme-dark{--bg-main:#1a1a2e;--bg-surface:#16213e;--bg-hover:#1a2744;--bg-input:#0f3460;--border:#2a3a5e;--border-light:#1e2d4a;--text-primary:#e8e8e8;--text-secondary:#b0b0b0;--text-tertiary:#8a8a8a;--primary:#8b6cff;--primary-hover:#7b5ce8;--primary-light:#1e1a3a;--secondary:#60a5fa;--success:#22c55e;--warning:#f59e0b;--danger:#ef4444;--msg-sent:var(--primary);--msg-received:#263348;--logo-url:url('https://i.ibb.co/jPxVQH4X/L-2.png')}
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        html{height:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;scroll-behavior:smooth}
        body{font-family:var(--font-family);background:var(--bg-main);color:var(--text-primary);line-height:1.5;height:100%;transition:background var(--transition-base),color var(--transition-base);overflow:hidden;position:fixed;inset:0}

        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
        @keyframes messageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        @keyframes pulse{0%,100%{opacity:0.3}50%{opacity:1}}
        @keyframes modalIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}

        .app-container{display:flex;flex-direction:column;height:100%;max-width:1200px;margin:0 auto;border-left:1px solid var(--border);border-right:1px solid var(--border);background:var(--bg-surface)}

        .navbar{position:sticky;top:0;z-index:50;background:var(--bg-surface);border-bottom:1px solid var(--border);padding:0.6rem 1.25rem;flex-shrink:0;display:flex;flex-direction:column;gap:0.4rem}
        .navbar-top{display:flex;align-items:center;gap:0.75rem}
        .navbar-back{display:flex;align-items:center;gap:0.4rem;cursor:pointer;color:var(--text-secondary);font-weight:600;font-size:0.875rem;transition:all var(--transition-fast);text-decoration:none;padding:0.35rem 0.6rem;border-radius:var(--radius-full)}
        .navbar-back:hover{background:var(--bg-hover);color:var(--primary)}
        .navbar-logo{width:34px;height:34px;background-image:var(--logo-url);background-size:contain;background-repeat:no-repeat;background-position:center;border-radius:var(--radius-sm);flex-shrink:0}
        .navbar-title{font-weight:700;font-size:1rem}
        .navbar-actions{margin-left:auto;display:flex;align-items:center;gap:0.4rem}

        .main-layout{display:flex;flex:1;overflow:hidden;min-height:0}
        .conversations-panel{width:360px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg-surface);overflow:hidden}
        .conv-header{padding:0.85rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
        .conv-header-title{font-weight:700;font-size:0.95rem;display:flex;align-items:center;gap:0.5rem}
        .conv-search-wrap{display:flex;align-items:center;background:var(--bg-input);border-radius:var(--radius-lg);padding:0.35rem 0.75rem;gap:0.4rem;margin:0.4rem 0.85rem;border:1px solid transparent;transition:all var(--transition-fast);flex-shrink:0}
        .conv-search-wrap:focus-within{background:var(--bg-surface);border-color:var(--primary);box-shadow:0 0 0 3px rgba(108,71,255,0.08)}
        .conv-search-wrap input{flex:1;border:none;background:transparent;outline:none;font-size:0.82rem;color:var(--text-primary);font-family:var(--font-family)}
        .conv-list{flex:1;overflow-y:auto}
        .conv-item{display:flex;align-items:center;gap:0.75rem;padding:0.8rem 1.1rem;cursor:pointer;transition:all var(--transition-fast);border-left:3px solid transparent}
        .conv-item:hover{background:var(--bg-hover)}
        .conv-item.active{background:var(--primary-light);border-left-color:var(--primary)}
        .conv-avatar{width:46px;height:46px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:0.85rem;flex-shrink:0}
        .conv-info{flex:1;min-width:0}
        .conv-name{font-weight:600;font-size:0.88rem}
        .conv-preview{font-size:0.76rem;color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:0.12rem}
        .conv-meta{text-align:right;flex-shrink:0}
        .conv-time{font-size:0.68rem;color:var(--text-tertiary)}
        .conv-badge{display:inline-flex;align-items:center;justify-content:center;background:var(--primary);color:#fff;font-size:0.62rem;font-weight:700;min-width:18px;height:18px;border-radius:var(--radius-full);padding:0 5px;margin-top:0.25rem}
        .conv-empty{text-align:center;padding:3rem 1.5rem;color:var(--text-tertiary)}
        .conv-empty-icon{font-size:2.5rem;margin-bottom:0.5rem;opacity:0.4}

        .chat-area{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg-main);overflow:hidden}
        .chat-header{padding:0.75rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:0.7rem;background:var(--bg-surface);flex-shrink:0}
        .chat-header-avatar{width:40px;height:40px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:0.8rem;flex-shrink:0;cursor:pointer}
        .chat-header-name{font-weight:600;font-size:0.9rem}
        .chat-header-username{font-size:0.72rem;color:var(--text-tertiary)}
        .chat-header-actions{margin-left:auto;display:flex;gap:0.2rem}

        .chat-messages-wrap{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;display:flex;flex-direction:column;scroll-behavior:smooth}
        .chat-messages{flex:1;padding:1.25rem;display:flex;flex-direction:column;gap:0.4rem;min-height:min-content}

        .msg-date-divider{text-align:center;font-size:0.7rem;color:var(--text-tertiary);margin:0.75rem 0;font-weight:600}
        .msg-date-divider span{background:var(--bg-main);padding:0.25rem 0.75rem;border-radius:var(--radius-full);border:1px solid var(--border-light)}
        .msg-bubble-wrap{position:relative;display:flex;flex-direction:column}
        .msg-bubble-wrap.sent{align-items:flex-end}.msg-bubble-wrap.received{align-items:flex-start}
        .msg-bubble{max-width:68%;padding:0.65rem 0.95rem;border-radius:var(--radius-xl);font-size:0.875rem;line-height:1.45;animation:messageIn 0.25s ease-out;word-break:break-word;position:relative}
        .msg-bubble.sent{background:var(--msg-sent);color:#fff;border-bottom-right-radius:var(--radius-sm)}
        .msg-bubble.received{background:var(--msg-received);color:var(--text-primary);border-bottom-left-radius:var(--radius-sm)}
        .msg-bubble .msg-link{color:inherit;text-decoration:underline;cursor:pointer}
        .msg-bubble.edited{opacity:0.9}
        .msg-edited-label{font-size:0.55rem;opacity:0.6;margin-top:0.1rem;text-align:right}
        .msg-reply-preview{background:rgba(0,0,0,0.06);border-left:3px solid var(--primary);padding:0.35rem 0.6rem;border-radius:var(--radius-sm);margin-bottom:0.3rem;font-size:0.72rem;cursor:pointer;max-width:250px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .dark .msg-reply-preview{background:rgba(255,255,255,0.05)}
        .msg-time{font-size:0.6rem;opacity:0.7;margin-top:0.2rem;text-align:right}
        .msg-link-preview{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-top:0.4rem;max-width:280px}
        .msg-link-preview img{width:100%;height:120px;object-fit:cover}
        .msg-link-preview-body{padding:0.5rem 0.7rem}
        .msg-link-preview-domain{font-size:0.6rem;color:var(--primary);text-transform:uppercase;font-weight:600}
        .msg-link-preview-title{font-size:0.75rem;font-weight:600;line-height:1.3;margin-top:0.15rem}

        .msg-actions{display:none;gap:0.2rem;position:absolute;top:-28px;z-index:5;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:0.2rem 0.35rem;box-shadow:0 2px 8px rgba(0,0,0,0.1);white-space:nowrap}
        .msg-bubble-wrap:hover .msg-actions{display:flex}
        .msg-bubble-wrap.sent .msg-actions{right:0}.msg-bubble-wrap.received .msg-actions{left:0}
        .msg-action-btn{width:28px;height:28px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-tertiary);transition:all var(--transition-fast);background:transparent;border:none;font-size:0.8rem}
        .msg-action-btn:hover{background:var(--primary-light);color:var(--primary)}

        .scroll-bottom-btn{position:absolute;bottom:1rem;right:1.5rem;width:38px;height:38px;border-radius:var(--radius-full);background:var(--bg-surface);border:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,0.12);display:none;align-items:center;justify-content:center;cursor:pointer;z-index:10;color:var(--text-secondary);transition:all var(--transition-fast);animation:fadeIn 0.2s ease-out}
        .scroll-bottom-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary);transform:scale(1.05)}
        .scroll-bottom-btn.show{display:flex}
        .scroll-bottom-badge{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;font-size:0.5rem;font-weight:700;min-width:14px;height:14px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;padding:0 3px}

        .chat-input-area{padding:0.6rem 1rem;border-top:1px solid var(--border);display:flex;gap:0.5rem;align-items:flex-end;background:var(--bg-surface);flex-shrink:0;position:relative;z-index:10}
        .chat-input-wrap{flex:1;display:flex;flex-direction:column;background:var(--bg-input);border-radius:var(--radius-xl);padding:0.35rem 0.7rem;border:1px solid transparent;transition:all var(--transition-fast)}
        .chat-input-wrap:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(108,71,255,0.08);background:var(--bg-surface)}
        .reply-indicator{display:none;align-items:center;gap:0.4rem;padding:0.2rem 0;font-size:0.7rem;color:var(--text-secondary);border-bottom:1px solid var(--border-light);margin-bottom:0.2rem}
        .reply-indicator.show{display:flex}
        .reply-indicator-text{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .reply-indicator-close{width:18px;height:18px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-tertiary);transition:all var(--transition-fast);background:transparent;border:none;font-size:0.7rem}
        .reply-indicator-close:hover{background:var(--bg-hover);color:var(--danger)}
        .chat-input-wrap textarea{flex:1;border:none;background:transparent;outline:none;resize:none;font-size:0.875rem;color:var(--text-primary);font-family:var(--font-family);max-height:80px;line-height:1.4;padding:0.1rem 0}
        .emoji-btn{width:34px;height:34px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-tertiary);transition:all var(--transition-fast);background:transparent;border:none;font-size:1.1rem;flex-shrink:0}
        .emoji-btn:hover{background:var(--bg-hover);color:var(--primary)}
        .send-btn{width:36px;height:36px;border-radius:var(--radius-full);background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--transition-fast);border:none;flex-shrink:0}
        .send-btn:hover{background:var(--primary-hover);transform:scale(1.05)}
        .send-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}

        .emoji-picker{position:absolute;bottom:75px;right:1rem;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:0.75rem;box-shadow:0 8px 30px rgba(0,0,0,0.15);z-index:60;display:none;width:340px;max-height:280px;overflow-y:auto}
        .emoji-picker.show{display:block;animation:fadeInUp 0.2s ease-out}
        .emoji-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:0.25rem}
        .emoji-item{font-size:1.35rem;cursor:pointer;padding:0.3rem;text-align:center;border-radius:var(--radius-sm);transition:all var(--transition-fast)}
        .emoji-item:hover{background:var(--primary-light);transform:scale(1.2)}

        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;visibility:hidden;transition:all var(--transition-base)}
        .modal-overlay.active{opacity:1;visibility:visible}
        .modal{background:var(--bg-surface);border-radius:var(--radius-2xl);padding:1.5rem;width:100%;max-width:440px;box-shadow:0 15px 40px rgba(0,0,0,0.2);animation:modalIn 0.2s ease-out;max-height:75vh;overflow-y:auto}
        .modal h3{font-weight:700;margin-bottom:1rem;display:flex;align-items:center;gap:0.5rem}
        .modal-input{width:100%;padding:0.6rem 0.85rem;border:1.5px solid var(--border);border-radius:var(--radius-md);font-size:0.875rem;background:var(--bg-input);color:var(--text-primary);outline:none;font-family:var(--font-family);margin-bottom:0.5rem}
        .modal-input:focus{border-color:var(--primary)}
        .share-link-list{max-height:220px;overflow-y:auto;margin:0.5rem 0}
        .share-link-item{display:flex;align-items:center;gap:0.6rem;padding:0.65rem;border-radius:var(--radius-md);cursor:pointer;transition:all var(--transition-fast);font-size:0.82rem;border:1px solid var(--border-light);margin-bottom:0.35rem}
        .share-link-item:hover{background:var(--bg-hover);border-color:var(--primary)}
        .share-link-item.selected{background:var(--primary-light);border-color:var(--primary);color:var(--primary)}
        .share-link-item-img{width:48px;height:36px;border-radius:var(--radius-sm);object-fit:cover;flex-shrink:0;background:var(--bg-hover)}

        .chat-placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;color:var(--text-tertiary)}
        .chat-placeholder-icon{font-size:3.5rem;margin-bottom:1rem;opacity:0.4}

        .btn{display:inline-flex;align-items:center;justify-content:center;gap:0.3rem;padding:0.5rem 1rem;border-radius:var(--radius-full);font-weight:600;font-size:0.875rem;transition:all var(--transition-fast);cursor:pointer;font-family:var(--font-family);border:none;white-space:nowrap}
        .btn:active{transform:scale(0.97)}
        .btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-hover)}
        .btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}.btn-outline:hover{background:var(--primary-light)}
        .btn-ghost{background:transparent;color:var(--text-secondary)}.btn-ghost:hover{background:var(--bg-hover)}
        .btn-sm{padding:0.3rem 0.75rem;font-size:0.8rem}
        .btn-icon{width:36px;height:36px;padding:0;border-radius:var(--radius-full)}
        .btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#b91c1c}

        .toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);padding:0.75rem 1.25rem;border-radius:var(--radius-md);font-size:0.8125rem;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.15);z-index:300;animation:slideIn 0.3s ease-out}
        .toast.success{background:var(--success);color:#fff}.toast.error{background:var(--danger);color:#fff}.toast.info{background:var(--primary);color:#fff}

        @media(max-width:768px){.conversations-panel{width:100%}.conversations-panel.hidden-mobile{display:none}.chat-area.hidden-mobile{display:none}.chat-messages{padding:0.75rem}.msg-bubble{max-width:85%}.emoji-picker{width:300px;right:0.5rem}.navbar-back span{display:none}.msg-actions{top:-30px}}
    </style>
</head>
<body class="theme-light">
    <div class="app-container">
        <nav class="navbar">
            <div class="navbar-top">
                <a class="navbar-back" href="index.html"><span class="iconify" data-icon="ph:arrow-left" data-width="18"></span><span>Back to Feed</span></a>
                <div class="navbar-actions"><button class="btn btn-icon btn-ghost" id="themeToggle" title="Toggle theme"><span class="iconify" data-icon="ph:moon" data-width="20" id="themeIcon"></span></button></div>
            </div>
            <div style="display:flex;align-items:center;gap:0.5rem;"><div class="navbar-logo"></div><span class="navbar-title">Messages</span></div>
        </nav>

        <div class="main-layout">
            <div class="conversations-panel" id="conversationsPanel">
                <div class="conv-header"><span class="conv-header-title"><span class="iconify" data-icon="ph:chats-circle" data-width="20"></span> Messages</span></div>
                <div class="conv-search-wrap"><span class="iconify" data-icon="ph:magnifying-glass" data-width="16" style="color:var(--text-tertiary);flex-shrink:0;"></span><input type="text" id="convSearchInput" placeholder="Search..." oninput="filterConversations()"></div>
                <div class="conv-list" id="convList"><div class="conv-empty"><div class="conv-empty-icon"><span class="iconify" data-icon="ph:chat-circle" data-width="48"></span></div><p style="font-weight:600;">No conversations</p><p style="font-size:0.8rem;">Follow someone to start chatting!</p></div></div>
                <div style="padding:0.65rem;border-top:1px solid var(--border);text-align:center;font-size:0.65rem;color:var(--text-tertiary);"><a href="#" target="_blank" rel="noopener" style="color:var(--primary);font-weight:600;">LinkSocial © 2026 · Built by PIReactive</a></div>
            </div>

            <div class="chat-area" id="chatArea">
                <div class="chat-placeholder" id="chatPlaceholder"><div class="chat-placeholder-icon"><span class="iconify" data-icon="ph:chats-circle" data-width="64"></span></div><h3>Your Messages</h3><p>Select a conversation or follow someone to start chatting</p></div>
                <div id="activeChat" style="display:none;flex:1;flex-direction:column;height:100%;">
                    <div class="chat-header">
                        <button class="btn btn-icon btn-ghost" id="backToConvs" style="display:none;"><span class="iconify" data-icon="ph:arrow-left" data-width="20"></span></button>
                        <div class="chat-header-avatar" id="chatPartnerAvatar" style="background:var(--primary);" onclick="viewPartnerProfile()">U</div>
                        <div><div class="chat-header-name" id="chatPartnerName">User</div><div class="chat-header-username" id="chatPartnerUsername">@user</div></div>
                        <div class="chat-header-actions">
                            <button class="btn btn-icon btn-ghost" id="blockBtn" title="Mute user"><span class="iconify" data-icon="ph:prohibit" data-width="18"></span></button>
                            <button class="btn btn-icon btn-ghost" id="viewProfileBtn" title="View profile"><span class="iconify" data-icon="ph:user" data-width="18"></span></button>
                        </div>
                    </div>
                    <div class="chat-messages-wrap" id="chatMessagesWrap">
                        <div class="chat-messages" id="chatMessages"></div>
                        <button class="scroll-bottom-btn" id="scrollBottomBtn" title="Scroll to bottom" onclick="scrollToBottom()"><span class="iconify" data-icon="ph:arrow-down" data-width="18"></span><span class="scroll-bottom-badge" id="scrollBadge" style="display:none;">0</span></button>
                    </div>
                    <div class="chat-input-area" id="chatInputArea">
                        <div class="emoji-picker" id="emojiPicker"><div class="emoji-grid" id="emojiGrid"></div></div>
                        <div class="chat-input-wrap">
                            <div class="reply-indicator" id="replyIndicator"><span class="iconify" data-icon="ph:arrow-bend-up-left" data-width="14"></span><span class="reply-indicator-text" id="replyIndicatorText"></span><button class="reply-indicator-close" onclick="cancelReply()"><span class="iconify" data-icon="ph:x" data-width="12"></span></button></div>
                            <textarea id="messageInput" placeholder="Type a message..." rows="1" oninput="autoResize(this)" onkeydown="handleEnter(event)"></textarea>
                        </div>
                        <button class="emoji-btn" id="emojiBtn" title="Add emoji"><span class="iconify" data-icon="ph:smiley" data-width="20"></span></button>

        async function markAsRead(){if(!activeChatUid||!currentUser)return;var convId=[currentUser.uid,activeChatUid].sort().join('_');var db=window.db;var ref=window.doc(db,'messages',convId);var docSnap=await window.getDoc(ref);if(docSnap.exists()){await window.updateDoc(ref,{unreadCount:0})}loadConversations()}
        function backToConvs(){$('#conversationsPanel').classList.remove('hidden-mobile');$('#chatArea').classList.add('hidden-mobile');$('#activeChat').style.display='none';$('#chatPlaceholder').style.display='flex';if(messagesListener){messagesListener();messagesListener=null}activeChatUid=null;activeChatUser=null}
        function viewPartnerProfile(){if(activeChatUid)window.open('profile.html?uid='+activeChatUid,'_self')}
        function requestNotificationPermission(){if(Notification&&Notification.permission==='default'){Notification.requestPermission()}}
        
        window.filterConversations=filterConversations;
        window.openChat=openChat;
        window.sendMessage=sendMessage;
        window.scrollToBottom=scrollToBottom;
        window.cancelReply=cancelReply;
        window.insertEmoji=insertEmoji;
        window.startReply=startReply;
        window.deleteMessage=deleteMessage;
        window.openEditModal=openEditModal;
        window.saveEditedMessage=saveEditedMessage;
        window.followAndChat=followAndChat;
        window.toggleBlock=toggleBlock;
        window.viewPartnerProfile=viewPartnerProfile;
        window.autoResize=autoResize;
        window.handleEnter=handleEnter;
        window.searchMyLinks=searchMyLinks;
        window.selectShareLink=selectShareLink;
        window.shareSelectedLink=shareSelectedLink;
        window.closeShareLinkModal=closeShareLinkModal;
        window.scrollToMsg=scrollToMsg;
        window.closeEditModal=closeEditModal;
        window.checkScrollPosition=checkScrollPosition;
        
        function initApp(){
            if(!window.auth || !window.onAuthStateChanged || !window.getDoc){
                setTimeout(initApp, 100);
                return;
            }
            window.onAuthStateChanged(window.auth, async function(u){
                if(u){
                    try{
                        var db=window.db;
                        var d=await window.getDoc(window.doc(db,'users',u.uid));
                        if(d.exists()){
                            currentUser=d.data();
                            currentUser.uid=u.uid;
                        }else{
                            currentUser={uid:u.uid,username:(u.email||'user').split('@')[0],accentColor:userColor((u.email||'user').split('@')[0]),emoji:'👤'};
                        }
                        await loadMyFollowing();
                        loadConversations();
                        var params=new URLSearchParams(window.location.search);
                        var targetUid=params.get('uid');
                        if(targetUid&&targetUid!==currentUser.uid){
                            openChat(targetUid);
                        }
                    }catch(e){console.error("Auth error:", e);toast("Error loading user data", "error");}
                }else{window.location.href='index.html';}
            });
        }
        
        document.addEventListener('DOMContentLoaded',function(){
            var t=localStorage.getItem('ls-theme')||'light';
            setTheme(t);
            $('#themeToggle').addEventListener('click',function(){var cur=document.body.classList.contains('theme-dark')?'dark':'light';setTheme(cur==='dark'?'light':'dark')});
            $('#backToConvs').addEventListener('click',backToConvs);
            $('#emojiBtn').addEventListener('click',function(e){e.stopPropagation();$('#emojiPicker').classList.toggle('show')});
            document.addEventListener('click',function(e){if(!e.target.closest('#emojiPicker')&&!e.target.closest('#emojiBtn')){$('#emojiPicker').classList.remove('show')}});
            renderEmojiPicker();
            requestNotificationPermission();
            var messagesWrap=$('#chatMessagesWrap');
            if(messagesWrap)messagesWrap.addEventListener('scroll',checkScrollPosition);
            $('#saveEditMsgBtn').addEventListener('click',saveEditedMessage);
            $('#cancelEditMsgBtn').addEventListener('click',closeEditModal);
            $('#editMsgModal').addEventListener('click',function(e){if(e.target===$('#editMsgModal'))closeEditModal()});
            $('#shareSelectedLinkBtn').addEventListener('click',shareSelectedLink);
            $('#cancelShareBtn').addEventListener('click',closeShareLinkModal);
            $('#shareLinkModal').addEventListener('click',function(e){if(e.target===$('#shareLinkModal'))closeShareLinkModal()});
            if(window.innerWidth<=768){$('#backToConvs').style.display='flex'}
            window.addEventListener('resize',function(){if(window.innerWidth<=768){$('#backToConvs').style.display='flex'}else{$('#backToConvs').style.display='none';$('#conversationsPanel').classList.remove('hidden-mobile');$('#chatArea').classList.remove('hidden-mobile')}});
            initApp();
        });
    </script>
</body>
</html>
