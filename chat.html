    <style>
        :root{--font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Roboto,'Helvetica Neue',Arial,sans-serif;--transition-fast:150ms cubic-bezier(0.4,0,0.2,1);--transition-base:250ms cubic-bezier(0.4,0,0.2,1);--radius-sm:0.375rem;--radius-md:0.5rem;--radius-lg:0.75rem;--radius-xl:1rem;--radius-2xl:1.5rem;--radius-full:9999px}

        .app-container{display:flex;flex-direction:column;height:100%;max-width:1200px;margin:0 auto;border-left:1px solid var(--border);border-right:1px solid var(--border);background:var(--bg-surface)}

        .chat-input-wrap textarea{flex:1;border:none;background:transparent;outline:none;resize:none;font-size:0.875rem;color:var(--text-primary);font-family:var(--font-family);max-height:80px;line-height:1.4;padding:0.1rem 0}
        .emoji-btn{width:34px;height:34px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-tertiary);transition:all var(--transition-fast);background:transparent;border:none;font-size:1.1rem;flex-shrink:0}

        .modal-input{width:100%;padding:0.6rem 0.85rem;border:1.5px solid var(--border);border-radius:var(--radius-md);font-size:0.875rem;background:var(--bg-input);color:var(--text-primary);outline:none;font-family:var(--font-family);margin-bottom:0.5rem}

        .share-link-list{max-height:220px;overflow-y:auto;margin:0.5rem 0}
        .share-link-item{display:flex;align-items:center;gap:0.6rem;padding:0.65rem;border-radius:var(--radius-md);cursor:pointer;transition:all var(--transition-fast);font-size:0.82rem;border:1px solid var(--border-light);margin-bottom:0.35rem}
        .share-link-item:hover{background:var(--bg-hover);border-color:var(--primary)}

        .share-link-item-img{width:48px;height:36px;border-radius:var(--radius-sm);object-fit:cover;flex-shrink:0;background:var(--bg-hover)}

        .chat-placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;color:var(--text-tertiary)}
        .chat-placeholder-icon{font-size:3.5rem;margin-bottom:1rem;opacity:0.4}

        .btn{display:inline-flex;align-items:center;justify-content:center;gap:0.3rem;padding:0.5rem 1rem;border-radius:var(--radius-full);font-weight:600;font-size:0.875rem;transition:all var(--transition-fast);cursor:pointer;font-family:var(--font-family);border:none;white-space:nowrap}

        .btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}.btn-outline:hover{background:var(--primary-light)}
        .btn-ghost{background:transparent;color:var(--text-secondary)}.btn-ghost:hover{background:var(--bg-hover)}
        .btn-sm{padding:0.3rem 0.75rem;font-size:0.8rem}
        .btn-icon{width:36px;height:36px;padding:0;border-radius:var(--radius-full)}
        .btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#b91c1c}

        .toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);padding:0.75rem 1.25rem;border-radius:var(--radius-md);font-size:0.8125rem;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.15);z-index:300;animation:slideIn 0.3s ease-out}
        .toast.success{background:var(--success);color:#fff}.toast.error{background:var(--danger);color:#fff}.toast.info{background:var(--primary);color:#fff}

        @media(max-width:768px){.conversations-panel{width:100%}.conversations-panel.hidden-mobile{display:none}.chat-area.hidden-mobile{display:none}.chat-messages{padding:0.75rem}.msg-bubble{max-width:85%}.emoji-picker{width:300px;right:0.5rem}.navbar-back span{display:none}}
    </style>
</head>

        var EMOJIS=['😀','😃','😄','😁','😅','😂','🤣','😊','😇','🙂','😉','😌','😍','🥰','😘','😋','😛','😜','🤪','😝','🤑','🤗','🤭','🤫','🤔','😐','😑','😶','😏','😒','🙄','😬','🤥','😔','😪','🤤','😴','😷','🤒','🤕','🤢','🤮','🤧','🥵','🥶','🥴','😵','🤯','🤠','🥳','🥸','😎','🤓','🧐','😕','😟','🙁','😮','😯','😲','😳','🥺','😢','😭','😤','😡','🤬','💀','👻','👽','🤖','🎉','🎊','👍','👎','👏','🙌','💪','🤝','❤️','💔','🔥','⭐','💯','✅','❌','⚡','💡','📌','📎','🔗','🛡️','🏆','🎯','💬','📢','🔔','⏰','🗓️','📊','📈','🚀','💻','🖥️','📱','🎮','🎵','📚','✍️','🧠','🗣️','👁️','🦾','🧬','🔬','🌍','🏠','🚗','✈️','🌈','🍕','☕','🍿','🎬','📷','💾'];

        function toast(m,t){t=t||'success';var el=document.createElement('div');el.className='toast '+t;el.textContent=m;document.body.appendChild(el);setTimeout(function(){el.style.opacity='0';el.style.transform='translateY(10px)';el.style.transition='all 0.3s';setTimeout(function(){el.remove()},300)},2500)}
        function setTheme(t){document.body.classList.remove('theme-light','theme-dark');document.body.classList.add('theme-'+t);$('#themeIcon').setAttribute('data-icon',t==='dark'?'ph:sun':'ph:moon');localStorage.setItem('ls-theme',t)}
        function formatTime(ts){var d=new Date(ts);var h=d.getHours();var m=d.getMinutes();var ampm=h>=12?'PM':'AM';h=h%12||12;m=m<10?'0'+m:m;return h+':'+m+' '+ampm}
        function formatDate(ts){var d=new Date(ts);var today=new Date();if(d.toDateString()===today.toDateString())return'Today';var yesterday=new Date(today);yesterday.setDate(yesterday.getDate()-1);if(d.toDateString()===yesterday.toDateString())return'Yesterday';return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}
        function autoResize(el){el.style.height='auto';var h=Math.min(el.scrollHeight,80);el.style.height=h+'px';$('#sendBtn').disabled=!el.value.trim()}
        function handleEnter(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}}

        function renderEmojiPicker(){var html='';EMOJIS.forEach(function(e){html+='<span class="emoji-item" onclick="insertEmoji(\''+e+'\')">'+e+'</span>'});$('#emojiGrid').innerHTML=html}
        function insertEmoji(e){var inp=$('#messageInput');var start=inp.selectionStart||0;var end=inp.selectionEnd||0;var text=inp.value;inp.value=text.substring(0,start)+e+text.substring(end);inp.selectionStart=inp.selectionEnd=start+e.length;inp.focus();autoResize(inp)}

        async function loadMyLinks(){if(!currentUser)return;var snap=await db.collection('links').where('ownerId','==',currentUser.uid).orderBy('createdAt','desc').limit(30).get();myLinks=snap.docs.map(function(d){return{id:d.id,title:d.data().title||'Untitled',url:d.data().url||'',description:d.data().description||'',screenshot:d.data().screenshot||d.data().previewImage||''}})}
        function searchMyLinks(){var q=$('#shareLinkSearch').value.toLowerCase().trim();var filtered=q?myLinks.filter(function(l){return l.title.toLowerCase().indexOf(q)!==-1||l.url.toLowerCase().indexOf(q)!==-1}):myLinks;renderShareLinkList(filtered)}
        function renderShareLinkList(links){var html='';links.forEach(function(l){var sc=l.screenshot;html+='<div class="share-link-item'+(selectedShareLink&&selectedShareLink.id===l.id?' selected':'')+'" onclick="selectShareLink(\''+l.id+'\',\''+esc(l.title)+'\',\''+esc(l.url)+'\',\''+esc(sc)+'\')"><div class="share-link-item-img">'+(sc?'<img src="'+esc(sc)+'" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentElement.innerHTML=\'<span class=iconify data-icon=ph:link-simple data-width=20></span>\'">':'<span class="iconify" data-icon="ph:link-simple" data-width="20"></span>')+'</div><div style="flex:1;min-width:0;"><div style="font-weight:600;font-size:0.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(l.title)+'</div><div style="font-size:0.7rem;color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(l.url)+'</div></div></div>'});$('#shareLinkList').innerHTML=html||'<p style="color:var(--text-tertiary);text-align:center;padding:1rem;">No links found</p>';$('#shareSelectedLinkBtn').disabled=!selectedShareLink;window.Iconify.scan($('#shareLinkList'))}
        function selectShareLink(id,title,url,screenshot){selectedShareLink={id:id,title:title,url:url,screenshot:screenshot};renderShareLinkList(myLinks)}
        function shareSelectedLink(){if(!selectedShareLink)return;var msg=selectedShareLink.title+'\n'+selectedShareLink.url;$('#messageInput').value=msg;autoResize($('#messageInput'));closeShareLinkModal();$('#messageInput').focus()}
        function openShareLinkModal(){loadMyLinks().then(function(){renderShareLinkList(myLinks);$('#shareLinkModal').classList.add('active');$('#shareLinkSearch').value=''})}
        function closeShareLinkModal(){$('#shareLinkModal').classList.remove('active');selectedShareLink=null}

        async function loadBlockedUsers(){if(!currentUser)return;var snap=await db.collection('users').doc(currentUser.uid).collection('blocked').get();blockedUsers=snap.docs.map(function(d){return d.id})}

        async function ensureConversationExists(convId,otherUid,otherName,senderName){
            var ref=db.collection('messages').doc(convId);var doc=await ref.get();
            if(!doc.exists){await ref.set({participants:[currentUser.uid,otherUid],participantNames:{[currentUser.uid]:senderName||currentUser.username||'User',[otherUid]:otherName||'User'},lastMessage:'',lastMessageAt:Date.now(),unreadCount:0,createdAt:Date.now()})}return ref}

        async function loadConversations(){if(!currentUser)return;await loadBlockedUsers();var snap=await db.collection('messages').where('participants','array-contains',currentUser.uid).orderBy('lastMessageAt','desc').get();conversations=snap.docs.map(function(d){return{id:d.id,data:d.data()}});renderConversations()}
        function filterConversations(){var q=$('#convSearchInput').value.toLowerCase().trim();var filtered=q?conversations.filter(function(c){var otherId=c.data.participants.find(function(p){return p!==currentUser.uid});var name=((c.data.participantNames||{})[otherId]||'').toLowerCase();return name.indexOf(q)!==-1}):conversations;renderConversationList(filtered)}
        function renderConversations(){renderConversationList(conversations)}
        function renderConversationList(list){var c=$('#convList');if(list.length===0){c.innerHTML='<div class="conv-empty"><div class="conv-empty-icon"><span class="iconify" data-icon="ph:chat-circle" data-width="48"></span></div><p style="font-weight:600;">No conversations</p><p style="font-size:0.8rem;">Follow someone to start chatting!</p></div>';return}var html='';list.forEach(function(conv){var otherId=conv.data.participants.find(function(p){return p!==currentUser.uid});var otherName=(conv.data.participantNames||{})[otherId]||'User';var active=activeChatUid===otherId;var unread=conv.data.unreadCount||0;var isBlocked=blockedUsers.indexOf(otherId)!==-1;html+='<div class="conv-item'+(active?' active':'')+(isBlocked?'':'')+'" onclick="openChat(\''+otherId+'\')"><div class="conv-avatar" style="background:'+userColor(otherName)+';">'+(otherName||'U')[0].toUpperCase()+'</div><div class="conv-info"><div class="conv-name">'+esc(otherName)+(isBlocked?' <span style="color:var(--danger);font-size:0.65rem;">(muted)</span>':'')+'</div><div class="conv-preview">'+(isBlocked?'Muted conversation':esc(conv.data.lastMessage||'No messages yet'))+'</div></div><div class="conv-meta"><div class="conv-time">'+timeAgo(conv.data.lastMessageAt)+'</div>'+(unread>0&&!isBlocked?'<div class="conv-badge">'+(unread>9?'9+':unread)+'</div>':'')+'</div></div>'});c.innerHTML=html;window.Iconify.scan(c)}

        async function loadMyFollowing(){if(!currentUser)return;var snap=await db.collection('users').doc(currentUser.uid).get();if(snap.exists){currentUser.followingList=snap.data().following||[]}}
        function isFollowingUser(uid){return currentUser&&currentUser.followingList&&currentUser.followingList.indexOf(uid)!==-1}

        async function openChat(uid){if(!currentUser||!uid)return;if(activeChatUid===uid)return;if(messagesListener){messagesListener();messagesListener=null}activeChatUid=uid;var doc=await db.collection('users').doc(uid).get();activeChatUser=doc.exists?doc.data():{username:'User',uid:uid};activeChatUser.uid=uid;var isFollowing=isFollowingUser(uid);var isBlocked=blockedUsers.indexOf(uid)!==-1;renderActiveChat(isFollowing,isBlocked);if(isFollowing&&!isBlocked){listenToMessages()}if(isFollowing){markAsRead()}renderConversations();if(window.innerWidth<=768){$('#conversationsPanel').classList.add('hidden-mobile');$('#chatArea').classList.remove('hidden-mobile')}}

        function renderActiveChat(isFollowing,isBlocked){$('#chatPlaceholder').style.display='none';var ac=$('#activeChat');ac.style.display='flex';$('#chatPartnerAvatar').style.background=activeChatUser.accentColor||userColor(activeChatUser.username||'User');$('#chatPartnerAvatar').textContent=(activeChatUser.emoji||(activeChatUser.username||'U')[0].toUpperCase());$('#chatPartnerName').textContent=activeChatUser.username||'User';$('#chatPartnerUsername').textContent='@'+(activeChatUser.username||'user');$('#viewProfileBtn').onclick=function(){window.open('profile.html?uid='+activeChatUid,'_self')};$('#blockBtn').onclick=toggleBlock;$('#blockBtn').innerHTML=isBlocked?'<span class="iconify" data-icon="ph:prohibit-inset" data-width="18" style="color:var(--danger);"></span>':'<span class="iconify" data-icon="ph:prohibit" data-width="18"></span>';$('#messageInput').value='';$('#sendBtn').disabled=true;if(!isFollowing){$('#chatInputArea').style.display='none';$('#chatMessages').innerHTML='<div class="chat-placeholder"><div class="chat-placeholder-icon"><span class="iconify" data-icon="ph:user-plus" data-width="48"></span></div><h3>Follow to chat</h3><p>You must follow @'+(activeChatUser.username||'user')+' to send messages.</p><button class="btn btn-primary btn-sm" onclick="followAndChat()"><span class="iconify" data-icon="ph:user-plus" data-width="14"></span> Follow & Chat</button></div>'}else if(isBlocked){$('#chatInputArea').style.display='none';$('#chatMessages').innerHTML='<div class="chat-placeholder"><div class="chat-placeholder-icon"><span class="iconify" data-icon="ph:prohibit" data-width="48"></span></div><h3>Conversation Muted</h3><p>You have muted @'+(activeChatUser.username||'user')+'. Unmute to resume notifications.</p><button class="btn btn-outline btn-sm" onclick="toggleBlock()"><span class="iconify" data-icon="ph:prohibit-inset" data-width="14"></span> Unmute</button></div>'}else{$('#chatInputArea').style.display='flex';$('#chatMessages').innerHTML=''}}

        async function followAndChat(){if(!currentUser||!activeChatUid)return;var meRef=db.collection('users').doc(currentUser.uid);var meDoc=await meRef.get();var myFollowing=meDoc.exists?meDoc.data().following||[]:[];if(myFollowing.indexOf(activeChatUid)===-1)myFollowing.push(activeChatUid);await meRef.update({following:myFollowing});var targetRef=db.collection('users').doc(activeChatUid);var targetDoc=await targetRef.get();var targetFollowers=targetDoc.exists?targetDoc.data().followers||[]:[];if(targetFollowers.indexOf(currentUser.uid)===-1)targetFollowers.push(currentUser.uid);await targetRef.update({followers:targetFollowers});if(!currentUser.followingList)currentUser.followingList=[];currentUser.followingList.push(activeChatUid);toast('Now following! You can chat.','success');var isBlocked=blockedUsers.indexOf(activeChatUid)!==-1;renderActiveChat(true,isBlocked);if(!isBlocked){listenToMessages()}}

        async function toggleBlock(){if(!currentUser||!activeChatUid)return;var idx=blockedUsers.indexOf(activeChatUid);if(idx!==-1){blockedUsers.splice(idx,1);await db.collection('users').doc(currentUser.uid).collection('blocked').doc(activeChatUid).delete();toast('User unmuted','info')}else{blockedUsers.push(activeChatUid);await db.collection('users').doc(currentUser.uid).collection('blocked').doc(activeChatUid).set({blockedAt:Date.now()});toast('User muted - notifications silenced','info');if(messagesListener){messagesListener();messagesListener=null}}renderActiveChat(true,blockedUsers.indexOf(activeChatUid)!==-1);renderConversations()}

        function listenToMessages(){if(blockedUsers.indexOf(activeChatUid)!==-1)return;var convId=[currentUser.uid,activeChatUid].sort().join('_');messagesListener=db.collection('messages').doc(convId).collection('messages').orderBy('timestamp','asc').onSnapshot(function(snap){var msgs=[];snap.docs.forEach(function(d){msgs.push(d.data())});renderMessages(msgs)})}
        function renderMessages(msgs){var c=$('#chatMessages');if(!c||c.querySelector('.chat-placeholder'))return;var html='';var lastDate='';msgs.forEach(function(m){var msgDate=formatDate(m.timestamp);if(msgDate!==lastDate){html+='<div class="msg-date-divider"><span>'+msgDate+'</span></div>';lastDate=msgDate}var isSent=m.senderId===currentUser.uid;var text=esc(m.text);var linkPreview='';var urlMatch=text.match(/(https?:\/\/[^\s]+)/);if(urlMatch){var url=urlMatch[1];var domain='';try{domain=new URL(url).hostname.replace('www.','')}catch(e){}text=text.replace(url,'<a href="'+url+'" target="_blank" rel="noopener" class="msg-link">'+domain+'</a>');linkPreview='<div class="msg-link-preview" onclick="window.open(\''+url+'\',\'_blank\')"><div class="msg-link-preview-body"><div class="msg-link-preview-domain">🔗 '+domain+'</div><div class="msg-link-preview-title">'+url+'</div></div></div>'}html+='<div class="msg-bubble '+(isSent?'sent':'received')+'"><span>'+text+'</span>'+linkPreview+'<div class="msg-time">'+formatTime(m.timestamp)+'</div></div>'});c.innerHTML=html;c.scrollTop=c.scrollHeight}

        async function sendMessage(){var text=$('#messageInput').value.trim();if(!text||!activeChatUid||!currentUser)return;if(blockedUsers.indexOf(activeChatUid)!==-1){toast('Unmute this user to send messages','error');return}var convId=[currentUser.uid,activeChatUid].sort().join('_');var msg={senderId:currentUser.uid,text:text,timestamp:Date.now()};var senderName=currentUser.username||'User';var receiverName=activeChatUser.username||'User';await ensureConversationExists(convId,activeChatUid,receiverName,senderName);await db.collection('messages').doc(convId).collection('messages').add(msg);await db.collection('messages').doc(convId).set({participants:[currentUser.uid,activeChatUid],participantNames:{[currentUser.uid]:senderName,[activeChatUid]:receiverName},lastMessage:text,lastMessageAt:Date.now(),unreadCount:firebase.firestore.FieldValue.increment(1)},{merge:true});$('#messageInput').value='';$('#sendBtn').disabled=true;$('#messageInput').style.height='auto';loadConversations();if(Notification&&Notification.permission==='granted'){navigator.serviceWorker.ready.then(function(reg){reg.showNotification('New message from @'+senderName,{body:text.substring(0,120),icon:'src/og-image.png',badge:'src/og-image.png',tag:'msg-'+convId})})}}

        async function markAsRead(){if(!activeChatUid||!currentUser)return;var convId=[currentUser.uid,activeChatUid].sort().join('_');var ref=db.collection('messages').doc(convId);var doc=await ref.get();if(doc.exists){await ref.update({unreadCount:0})}loadConversations()}
        function backToConvs(){$('#conversationsPanel').classList.remove('hidden-mobile');$('#chatArea').classList.add('hidden-mobile');$('#activeChat').style.display='none';$('#chatPlaceholder').style.display='flex';if(messagesListener){messagesListener();messagesListener=null}activeChatUid=null;activeChatUser=null}
        function viewPartnerProfile(){if(activeChatUid)window.open('profile.html?uid='+activeChatUid,'_self')}
        function requestNotificationPermission(){if(Notification&&Notification.permission==='default'){Notification.requestPermission()}}

        auth.onAuthStateChanged(async function(u){if(u){var d=await db.collection('users').doc(u.uid).get();if(d.exists){currentUser=d.data();currentUser.uid=u.uid}else{currentUser={uid:u.uid,username:(u.email||'user').split('@')[0],accentColor:userColor((u.email||'user').split('@')[0]),emoji:'👤'}}await loadMyFollowing()}else{window.location.href='index.html';return}loadConversations();var params=new URLSearchParams(window.location.search);var targetUid=params.get('uid');if(targetUid&&targetUid!==currentUser.uid){openChat(targetUid)}});

        document.addEventListener('DOMContentLoaded',function(){var t=localStorage.getItem('ls-theme')||'light';setTheme(t);$('#themeToggle').addEventListener('click',function(){var cur=document.body.classList.contains('theme-dark')?'dark':'light';setTheme(cur==='dark'?'light':'dark')});$('#backToConvs').addEventListener('click',backToConvs);$('#emojiBtn').addEventListener('click',function(e){e.stopPropagation();$('#emojiPicker').classList.toggle('show')});document.addEventListener('click',function(e){if(!e.target.closest('#emojiPicker')&&!e.target.closest('#emojiBtn')){$('#emojiPicker').classList.remove('show')}});renderEmojiPicker();requestNotificationPermission();if(window.innerWidth<=768){$('#backToConvs').style.display='flex'}window.addEventListener('resize',function(){if(window.innerWidth<=768){$('#backToConvs').style.display='flex'}else{$('#backToConvs').style.display='none';$('#conversationsPanel').classList.remove('hidden-mobile');$('#chatArea').classList.remove('hidden-mobile')}})});
    </script>
</body>
</html>
