    <style>
        :root{--font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Roboto,'Helvetica Neue',Arial,sans-serif;--transition-fast:150ms cubic-bezier(0.4,0,0.2,1);--transition-base:250ms cubic-bezier(0.4,0,0.2,1);--radius-sm:0.375rem;--radius-md:0.5rem;--radius-lg:0.75rem;--radius-xl:1rem;--radius-2xl:1.5rem;--radius-full:9999px}

        .app-container{display:flex;flex-direction:column;height:100%;width:100%;max-width:1200px;margin:0 auto;border-left:1px solid var(--border);border-right:1px solid var(--border);background:var(--bg-surface)}

        .chat-input-area{padding:0.5rem 0.85rem;border-top:1px solid var(--border);display:flex;gap:0.4rem;align-items:flex-end;background:var(--bg-surface);flex-shrink:0;position:relative}

        .reply-indicator-close:hover{background:var(--bg-hover);color:var(--danger)}
        .chat-input-wrap textarea{flex:1;border:none;background:transparent;outline:none;resize:none;font-size:0.85rem;color:var(--text-primary);font-family:var(--font-family);max-height:70px;line-height:1.4;padding:0.08rem 0}
        .emoji-btn{width:30px;height:30px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-tertiary);transition:all var(--transition-fast);background:transparent;border:none;font-size:1rem;flex-shrink:0}
        .emoji-btn:hover{background:var(--bg-hover);color:var(--primary)}
        .send-btn{width:34px;height:34px;border-radius:var(--radius-full);background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--transition-fast);border:none;flex-shrink:0}
        .send-btn:hover{background:var(--primary-hover);transform:scale(1.05)}
        .send-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}

        .emoji-picker{position:absolute;bottom:65px;right:0.85rem;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:0.6rem;box-shadow:0 8px 30px rgba(0,0,0,0.15);z-index:60;display:none;width:300px;max-height:240px;overflow-y:auto}
        .emoji-picker.show{display:block;animation:fadeInUp 0.2s ease-out}
        .emoji-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:0.2rem}
        .emoji-item{font-size:1.2rem;cursor:pointer;padding:0.25rem;text-align:center;border-radius:var(--radius-sm);transition:all var(--transition-fast)}
        .emoji-item:hover{background:var(--primary-light);transform:scale(1.2)}

        .chat-placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;color:var(--text-tertiary)}
        .chat-placeholder-icon{font-size:3rem;margin-bottom:0.75rem;opacity:0.4}

        .btn{display:inline-flex;align-items:center;justify-content:center;gap:0.25rem;padding:0.4rem 0.85rem;border-radius:var(--radius-full);font-weight:600;font-size:0.85rem;transition:all var(--transition-fast);cursor:pointer;font-family:var(--font-family);border:none;white-space:nowrap}
        .btn:active{transform:scale(0.97)}
        .btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-hover)}
        .btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}.btn-outline:hover{background:var(--primary-light)}
        .btn-ghost{background:transparent;color:var(--text-secondary)}.btn-ghost:hover{background:var(--bg-hover)}
        .btn-sm{padding:0.25rem 0.65rem;font-size:0.78rem}
        .btn-icon{width:32px;height:32px;padding:0;border-radius:var(--radius-full)}

        .toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);padding:0.65rem 1rem;border-radius:var(--radius-md);font-size:0.8rem;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.15);z-index:300;animation:slideIn 0.3s ease-out}
        .toast.success{background:var(--success);color:#fff}.toast.error{background:var(--danger);color:#fff}.toast.info{background:var(--primary);color:#fff}

        @media(max-width:768px){.conversations-panel{width:100%}.conversations-panel.hidden-mobile{display:none}.chat-area.hidden-mobile{display:none}.chat-messages{padding:0.75rem}.msg-bubble{max-width:85%}.emoji-picker{width:280px;right:0.5rem}.navbar-back span{display:none}}
    </style>
</head>

        function handleEnter(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}}

        var currentUser=null,conversations=[],activeChatUid=null,activeChatUser=null,messagesListener=null,blockedUsers=[],replyingTo=null,editingMsgId=null;
        var EMOJIS=['😀','😃','😄','😁','😅','😂','🤣','😊','😇','🙂','😉','😌','😍','🥰','😘','😋','😛','😜','🤪','😎','🤓','😕','😮','😯','😲','😳','🥺','😢','😭','😤','😡','🤬','💀','👻','👽','🤖','🎉','👍','👎','👏','🙌','💪','🤝','❤️','🔥','⭐','💯','✅','❌','⚡','📌','🔗','🛡️','🏆','💬','📢','🔔','🚀','💻','📱','🎮','🎵','📚','🍕','☕','🎬'];

        function toast(m,t){t=t||'success';var el=document.createElement('div');el.className='toast '+t;el.textContent=m;document.body.appendChild(el);setTimeout(function(){el.style.opacity='0';el.style.transition='all 0.3s';setTimeout(function(){el.remove()},300)},2500)}
        function setTheme(t){document.body.classList.remove('theme-light','theme-dark');document.body.classList.add('theme-'+t);$('#themeIcon').setAttribute('data-icon',t==='dark'?'ph:sun':'ph:moon');localStorage.setItem('ls-theme',t)}
        function scrollToBottom(){var wrap=$('#chatMessagesWrap');if(wrap){wrap.scrollTop=wrap.scrollHeight;$('#scrollBottomBtn').classList.remove('show')}}
        function checkScrollPosition(){var wrap=$('#chatMessagesWrap');if(!wrap)return;if(wrap.scrollHeight-wrap.scrollTop-wrap.clientHeight>200){$('#scrollBottomBtn').classList.add('show')}else{$('#scrollBottomBtn').classList.remove('show')}}

        function renderEmojiPicker(){var html='';EMOJIS.forEach(function(e){html+='<span class="emoji-item" onclick="insertEmoji(\''+e+'\')">'+e+'</span>'});$('#emojiGrid').innerHTML=html}
        function insertEmoji(e){var inp=$('#messageInput');var start=inp.selectionStart||0;inp.value=inp.value.substring(0,start)+e+inp.value.substring(inp.selectionEnd||start);inp.selectionStart=inp.selectionEnd=start+e.length;inp.focus();autoResize(inp)}
        function startReply(id,text,name){replyingTo={id:id,text:text,sender:name};$('#replyIndicator').classList.add('show');$('#replyIndicatorText').textContent='Replying to @'+name;$('#messageInput').focus()}
        function cancelReply(){replyingTo=null;$('#replyIndicator').classList.remove('show')}
        function openEditModal(id,text){editingMsgId=id;$('#editMsgInput').value=text;$('#editMsgModal').classList.add('active');$('#editMsgInput').focus()}
        function closeEditModal(){editingMsgId=null;$('#editMsgModal').classList.remove('active')}
        async function saveEditedMessage(){var text=$('#editMsgInput').value.trim();if(!text||!editingMsgId||!activeChatUid)return;var convId=[currentUser.uid,activeChatUid].sort().join('_');await db.collection('messages').doc(convId).collection('messages').doc(editingMsgId).update({text:text,edited:true,editedAt:Date.now()});closeEditModal();toast('Updated','success')}
        async function deleteMessage(msgId){if(!confirm('Delete?'))return;var convId=[currentUser.uid,activeChatUid].sort().join('_');await db.collection('messages').doc(convId).collection('messages').doc(msgId).delete();toast('Deleted','info')}

        async function loadBlockedUsers(){if(!currentUser)return;var snap=await db.collection('users').doc(currentUser.uid).collection('blocked').get();blockedUsers=snap.docs.map(function(d){return d.id})}
        async function ensureConv(convId,ouid,oname,sname){var ref=db.collection('messages').doc(convId);if(!(await ref.get()).exists){await ref.set({participants:[currentUser.uid,ouid],participantNames:{[currentUser.uid]:sname||currentUser.username||'User',[ouid]:oname||'User'},lastMessage:'',lastMessageAt:Date.now(),unreadCount:0,createdAt:Date.now()})}return ref}

        async function loadConversations(){if(!currentUser)return;await loadBlockedUsers();var snap=await db.collection('messages').where('participants','array-contains',currentUser.uid).orderBy('lastMessageAt','desc').get();conversations=snap.docs.map(function(d){return{id:d.id,data:d.data()}});renderConversations()}
        function filterConversations(){var q=$('#convSearchInput').value.toLowerCase().trim();var filtered=q?conversations.filter(function(c){var oid=c.data.participants.find(function(p){return p!==currentUser.uid});return((c.data.participantNames||{})[oid]||'').toLowerCase().indexOf(q)!==-1}):conversations;renderConversationList(filtered)}
        function renderConversations(){renderConversationList(conversations)}
        function renderConversationList(list){var c=$('#convList');if(list.length===0){c.innerHTML='<div class="conv-empty"><div class="conv-empty-icon"><span class="iconify" data-icon="ph:chat-circle" data-width="40"></span></div><p style="font-weight:600;">No conversations</p><p style="font-size:0.78rem;">Follow someone to start chatting!</p></div>';return}var html='';list.forEach(function(conv){var oid=conv.data.participants.find(function(p){return p!==currentUser.uid});var oname=(conv.data.participantNames||{})[oid]||'User';var active=activeChatUid===oid;var unread=conv.data.unreadCount||0;var blocked=blockedUsers.indexOf(oid)!==-1;html+='<div class="conv-item'+(active?' active':'')+'" onclick="openChat(\''+oid+'\')"><div class="conv-avatar" style="background:'+userColor(oname)+';">'+(oname||'U')[0].toUpperCase()+'</div><div class="conv-info"><div class="conv-name">'+esc(oname)+(blocked?' <span style="color:var(--danger);font-size:0.6rem;">(muted)</span>':'')+'</div><div class="conv-preview">'+(blocked?'Muted':esc(conv.data.lastMessage||'No messages'))+'</div></div><div class="conv-meta"><div class="conv-time">'+timeAgo(conv.data.lastMessageAt)+'</div>'+(unread>0&&!blocked?'<div class="conv-badge">'+(unread>9?'9+':unread)+'</div>':'')+'</div></div>'});c.innerHTML=html;window.Iconify.scan(c)}

        async function loadMyFollowing(){if(!currentUser)return;var snap=await db.collection('users').doc(currentUser.uid).get();if(snap.exists)currentUser.followingList=snap.data().following||[]}
        function isFollowing(uid){return currentUser&&currentUser.followingList&&currentUser.followingList.indexOf(uid)!==-1}

        async function openChat(uid){if(!currentUser||!uid||activeChatUid===uid)return;if(messagesListener){messagesListener();messagesListener=null}activeChatUid=uid;var doc=await db.collection('users').doc(uid).get();activeChatUser=doc.exists?doc.data():{username:'User',uid:uid};activeChatUser.uid=uid;var following=isFollowing(uid);var blocked=blockedUsers.indexOf(uid)!==-1;renderActiveChat(following,blocked);if(following&&!blocked)listenToMessages();if(following)markAsRead();renderConversations();cancelReply();scrollToBottom();if(window.innerWidth<=768){$('#conversationsPanel').classList.add('hidden-mobile');$('#chatArea').classList.remove('hidden-mobile')}}

        function renderActiveChat(following,blocked){$('#chatPlaceholder').style.display='none';$('#activeChat').style.display='flex';$('#chatPartnerAvatar').style.background=activeChatUser.accentColor||userColor(activeChatUser.username||'User');$('#chatPartnerAvatar').textContent=(activeChatUser.emoji||(activeChatUser.username||'U')[0].toUpperCase());$('#chatPartnerName').textContent=activeChatUser.username||'User';$('#chatPartnerUsername').textContent='@'+(activeChatUser.username||'user');$('#viewProfileBtn').onclick=function(){window.open('profile.html?uid='+activeChatUid,'_self')};$('#blockBtn').onclick=toggleBlock;$('#blockBtn').innerHTML=blocked?'<span class="iconify" data-icon="ph:prohibit-inset" data-width="16" style="color:var(--danger);"></span>':'<span class="iconify" data-icon="ph:prohibit" data-width="16"></span>';$('#messageInput').value='';$('#sendBtn').disabled=true;if(!following){$('#chatInputArea').style.display='none';$('#chatMessages').innerHTML='<div class="chat-placeholder"><div class="chat-placeholder-icon"><span class="iconify" data-icon="ph:user-plus" data-width="40"></span></div><h3>Follow to chat</h3><p>Follow @'+(activeChatUser.username||'user')+' to send messages.</p><button class="btn btn-primary btn-sm" onclick="followAndChat()"><span class="iconify" data-icon="ph:user-plus" data-width="14"></span> Follow & Chat</button></div>'}else if(blocked){$('#chatInputArea').style.display='none';$('#chatMessages').innerHTML='<div class="chat-placeholder"><div class="chat-placeholder-icon"><span class="iconify" data-icon="ph:prohibit" data-width="40"></span></div><h3>Muted</h3><p>You muted @'+(activeChatUser.username||'user')+'.</p><button class="btn btn-outline btn-sm" onclick="toggleBlock()"><span class="iconify" data-icon="ph:prohibit-inset" data-width="14"></span> Unmute</button></div>'}else{$('#chatInputArea').style.display='flex';$('#chatMessages').innerHTML=''}}

        async function followAndChat(){if(!currentUser||!activeChatUid)return;var meRef=db.collection('users').doc(currentUser.uid);var meDoc=await meRef.get();var myFollowing=meDoc.exists?meDoc.data().following||[]:[];if(myFollowing.indexOf(activeChatUid)===-1)myFollowing.push(activeChatUid);await meRef.update({following:myFollowing});var tRef=db.collection('users').doc(activeChatUid);var tDoc=await tRef.get();var tFollowers=tDoc.exists?tDoc.data().followers||[]:[];if(tFollowers.indexOf(currentUser.uid)===-1)tFollowers.push(currentUser.uid);await tRef.update({followers:tFollowers});if(!currentUser.followingList)currentUser.followingList=[];currentUser.followingList.push(activeChatUid);toast('Following!','success');renderActiveChat(true,blockedUsers.indexOf(activeChatUid)!==-1);listenToMessages()}

        async function toggleBlock(){if(!currentUser||!activeChatUid)return;var idx=blockedUsers.indexOf(activeChatUid);if(idx!==-1){blockedUsers.splice(idx,1);await db.collection('users').doc(currentUser.uid).collection('blocked').doc(activeChatUid).delete();toast('Unmuted','info')}else{blockedUsers.push(activeChatUid);await db.collection('users').doc(currentUser.uid).collection('blocked').doc(activeChatUid).set({blockedAt:Date.now()});toast('Muted','info');if(messagesListener){messagesListener();messagesListener=null}}renderActiveChat(true,blockedUsers.indexOf(activeChatUid)!==-1);renderConversations()}

        function listenToMessages(){if(blockedUsers.indexOf(activeChatUid)!==-1)return;var convId=[currentUser.uid,activeChatUid].sort().join('_');messagesListener=db.collection('messages').doc(convId).collection('messages').orderBy('timestamp','asc').onSnapshot(function(snap){var msgs=[];snap.docs.forEach(function(d){var m=d.data();m.id=d.id;msgs.push(m)});renderMessages(msgs)})}
        function renderMessages(msgs){var c=$('#chatMessages');if(!c||c.querySelector('.chat-placeholder'))return;var nearBottom=$('#chatMessagesWrap').scrollHeight-$('#chatMessagesWrap').scrollTop-$('#chatMessagesWrap').clientHeight<200;var html='';var lastDate='';msgs.forEach(function(m){var msgDate=formatDate(m.timestamp);if(msgDate!==lastDate){html+='<div class="msg-date-divider"><span>'+msgDate+'</span></div>';lastDate=msgDate}var isSent=m.senderId===currentUser.uid;var text=esc(m.text);var replyPrev='';if(m.replyTo)replyPrev='<div class="msg-reply-preview" style="background:rgba(0,0,0,0.05);border-left:2px solid var(--primary);padding:0.2rem 0.4rem;border-radius:var(--radius-sm);margin-bottom:0.2rem;font-size:0.7rem;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">↳ '+esc((m.replyTo.text||'').substring(0,50))+'</div>';var urlMatch=text.match(/(https?:\/\/[^\s]+)/);if(urlMatch){var url=urlMatch[1];var domain='';try{domain=new URL(url).hostname.replace('www.','')}catch(e){}text=text.replace(url,'<a href="'+url+'" target="_blank" rel="noopener" class="msg-link">🔗 '+domain+'</a>')}html+='<div class="msg-bubble-wrap '+(isSent?'sent':'received')+'"><div class="msg-actions">'+(isSent?'<button class="msg-action-btn" title="Edit" onclick="event.stopPropagation();openEditModal(\''+m.id+'\',\''+esc(m.text)+'\')"><span class="iconify" data-icon="ph:pencil-simple" data-width="13"></span></button><button class="msg-action-btn" title="Delete" onclick="event.stopPropagation();deleteMessage(\''+m.id+'\')"><span class="iconify" data-icon="ph:trash" data-width="13"></span></button>':'')+'<button class="msg-action-btn" title="Reply" onclick="event.stopPropagation();startReply(\''+m.id+'\',\''+esc((m.text||'').substring(0,40))+'\',\''+esc(m.senderName||'User')+'\')"><span class="iconify" data-icon="ph:arrow-bend-up-left" data-width="13"></span></button></div>'+replyPrev+'<div class="msg-bubble '+(isSent?'sent':'received')+(m.edited?' edited':'')+'"><span>'+text+'</span>'+(m.edited?'<div style="font-size:0.5rem;opacity:0.5;margin-top:0.1rem;text-align:right;">edited</div>':'')+'<div class="msg-time">'+formatTime(m.timestamp)+'</div></div></div>'});c.innerHTML=html;window.Iconify.scan(c);if(nearBottom)scrollToBottom();checkScrollPosition()}

        async function sendMessage(){var text=$('#messageInput').value.trim();if(!text||!activeChatUid||!currentUser)return;if(blockedUsers.indexOf(activeChatUid)!==-1){toast('Unmute to send','error');return}var convId=[currentUser.uid,activeChatUid].sort().join('_');var msg={senderId:currentUser.uid,text:text,timestamp:Date.now(),senderName:currentUser.username||'User'};if(replyingTo){msg.replyTo={id:replyingTo.id,text:replyingTo.text,sender:replyingTo.sender};cancelReply()}var sn=currentUser.username||'User';var rn=activeChatUser.username||'User';await ensureConv(convId,activeChatUid,rn,sn);await db.collection('messages').doc(convId).collection('messages').add(msg);await db.collection('messages').doc(convId).set({participants:[currentUser.uid,activeChatUid],participantNames:{[currentUser.uid]:sn,[activeChatUid]:rn},lastMessage:text,lastMessageAt:Date.now(),unreadCount:firebase.firestore.FieldValue.increment(1)},{merge:true});$('#messageInput').value='';$('#sendBtn').disabled=true;$('#messageInput').style.height='auto';loadConversations();scrollToBottom()}

        async function markAsRead(){if(!activeChatUid||!currentUser)return;var convId=[currentUser.uid,activeChatUid].sort().join('_');var ref=db.collection('messages').doc(convId);var doc=await ref.get();if(doc.exists)await ref.update({unreadCount:0});loadConversations()}
        function backToConvs(){$('#conversationsPanel').classList.remove('hidden-mobile');$('#chatArea').classList.add('hidden-mobile');$('#activeChat').style.display='none';$('#chatPlaceholder').style.display='flex';if(messagesListener){messagesListener();messagesListener=null}activeChatUid=null;activeChatUser=null}
        function viewPartnerProfile(){if(activeChatUid)window.open('profile.html?uid='+activeChatUid,'_self')}

        auth.onAuthStateChanged(async function(u){if(u){var d=await db.collection('users').doc(u.uid).get();currentUser=d.exists?Object.assign({uid:u.uid},d.data()):{uid:u.uid,username:(u.email||'user').split('@')[0],accentColor:userColor((u.email||'user').split('@')[0]),emoji:'👤'};await loadMyFollowing()}else{window.location.href='index.html';return}loadConversations();var params=new URLSearchParams(window.location.search);var target=params.get('uid');if(target&&target!==currentUser.uid)openChat(target)});

        document.addEventListener('DOMContentLoaded',function(){var t=localStorage.getItem('ls-theme')||'light';setTheme(t);$('#themeToggle').addEventListener('click',function(){var cur=document.body.classList.contains('theme-dark')?'dark':'light';setTheme(cur==='dark'?'light':'dark')});$('#backToConvs').addEventListener('click',backToConvs);$('#emojiBtn').addEventListener('click',function(e){e.stopPropagation();$('#emojiPicker').classList.toggle('show')});document.addEventListener('click',function(e){if(!e.target.closest('#emojiPicker')&&!e.target.closest('#emojiBtn'))$('#emojiPicker').classList.remove('show')});renderEmojiPicker();$('#chatMessagesWrap').addEventListener('scroll',checkScrollPosition);$('#saveEditMsgBtn').addEventListener('click',saveEditedMessage);$('#cancelEditMsgBtn').addEventListener('click',closeEditModal);$('#editMsgModal').addEventListener('click',function(e){if(e.target===$('#editMsgModal'))closeEditModal()});if(window.innerWidth<=768){$('#backToConvs').style.display='flex'}window.addEventListener('resize',function(){if(window.innerWidth<=768){$('#backToConvs').style.display='flex'}else{$('#backToConvs').style.display='none';$('#conversationsPanel').classList.remove('hidden-mobile');$('#chatArea').classList.remove('hidden-mobile')}})});
    </script>
</body>
</html>
