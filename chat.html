        @media(max-width:768px){.sidebar{width:100%}.sidebar.hidden{display:none}.main.hidden{display:none}}
    </style>
</head>

        var scrollTimeout=null;
        
        function scrollToBottom(){var w=$('#messagesArea');if(w){isUserScrolling=false;w.scrollTop=w.scrollHeight;$('#scrollBtn').classList.remove('show');}}
        function checkScroll(){var w=$('#messagesArea');if(!w)return;var isAtBottom=w.scrollHeight-w.scrollTop-w.clientHeight<50;if(isAtBottom){$('#scrollBtn').classList.remove('show');isUserScrolling=false;}else{$('#scrollBtn').classList.add('show');isUserScrolling=true;}}
        function autoResize(e){e.style.height='auto';e.style.height=Math.min(e.scrollHeight,65)+'px';$('#sendBtn').disabled=!e.value.trim()}

        function renderEmojis(){var h='';EMOJIS.forEach(function(e){h+='<span class="emoji-item" onclick="insertEmoji(\''+e+'\')">'+e+'</span>'});$('#emojiGrid').innerHTML=h}
        function insertEmoji(e){var inp=$('#msgInput');var s=inp.selectionStart||0;inp.value=inp.value.substring(0,s)+e+inp.value.substring(inp.selectionEnd||s);inp.selectionStart=inp.selectionEnd=s+e.length;inp.focus();autoResize(inp)}
        function startReply(id,text,name){replying={id:id,text:text,sender:name};$('#replyBar').classList.add('show');$('#replyText').textContent='Replying to @'+name;$('#msgInput').focus()}
        function cancelReply(){replying=null;$('#replyBar').classList.remove('show')}
        function openEditModal(id,text){editingId=id;$('#editInput').value=text;$('#editModal').classList.add('active');$('#editInput').focus()}
        function closeEditModal(){editingId=null;$('#editModal').classList.remove('active')}
        async function saveEdit(){var t=$('#editInput').value.trim();if(!t||!editingId||!activeUid)return;var cid=[user.uid,activeUid].sort().join('_');await db.collection('messages').doc(cid).collection('messages').doc(editingId).update({text:t,edited:true});closeEditModal();toast('Updated')}
        async function deleteMsg(id){if(!confirm('Delete?'))return;var cid=[user.uid,activeUid].sort().join('_');await db.collection('messages').doc(cid).collection('messages').doc(id).delete();toast('Deleted')}

        async function loadLinks(){if(!user)return;try{var s=await db.collection('links').where('ownerId','==',user.uid).orderBy('createdAt','desc').limit(20).get();myLinks=s.docs.map(function(d){return{id:d.id,title:d.data().title||'Untitled',url:d.data().url||'',screenshot:d.data().screenshot||d.data().previewImage||''}})}catch(e){myLinks=[]}}
        function searchLinks(){var q=$('#linkSearch').value.toLowerCase().trim();var f=q?myLinks.filter(function(l){return l.title.toLowerCase().indexOf(q)!==-1||l.url.toLowerCase().indexOf(q)!==-1}):myLinks;renderLinkList(f)}
        function renderLinkList(list){var h='';list.forEach(function(l){h+='<div class="link-item'+(selectedLink&&selectedLink.id===l.id?' selected':'')+'" onclick="selectLink(\''+l.id+'\',\''+esc(l.title)+'\',\''+esc(l.url)+'\')"><div class="link-item-img">'+(l.screenshot?'<img src="'+esc(l.screenshot)+'" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.innerHTML=\'<span class=iconify data-icon=ph:link-simple data-width=16></span>\'">':'<span class="iconify" data-icon="ph:link-simple" data-width="16"></span>')+'</div><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:0.75rem">'+esc(l.title)+'</div><div style="font-size:0.68rem;color:var(--t3)">'+esc(l.url)+'</div></div></div>'});$('#linkList').innerHTML=h||'<p style="color:var(--t3);text-align:center;padding:0.5rem;font-size:0.75rem">No links found</p>'}
        function selectLink(id,title,url){selectedLink={id:id,title:title,url:url};renderLinkList(myLinks)}
        function shareLink(){if(!selectedLink)return;toast('Link added to message');$('#msgInput').value=selectedLink.title+'\n'+selectedLink.url;autoResize($('#msgInput'));$('#linkPicker').classList.remove('show');$('#msgInput').focus()}
        function openLinkPicker(){loadLinks().then(function(){renderLinkList(myLinks);$('#linkPicker').classList.toggle('show');$('#emojiPicker').classList.remove('show');$('#linkSearch').value='';if($('#linkPicker').classList.contains('show'))setTimeout(function(){$('#linkSearch').focus()},100)})}

        async function loadBlocked(){if(!user)return;var s=await db.collection('users').doc(user.uid).collection('blocked').get();blocked=s.docs.map(function(d){return d.id})}
        async function ensureConv(cid,oid,oname,sname){var ref=db.collection('messages').doc(cid);if(!(await ref.get()).exists){var pn={};pn[user.uid]=sname||user.username||'User';pn[oid]=oname||'User';await ref.set({participants:[user.uid,oid],participantNames:pn,lastMessage:'',lastMessageAt:Date.now(),unreadCount:0})}return ref}

        async function loadConvs(){if(!user)return;await loadBlocked();var s=await db.collection('messages').where('participants','array-contains',user.uid).orderBy('lastMessageAt','desc').get();convs=s.docs.map(function(d){return{id:d.id,data:d.data()}});renderConvList(convs)}
        function filterConvs(){var q=$('#sidebarSearch').value.toLowerCase().trim();renderConvList(q?convs.filter(function(c){var oid=c.data.participants.find(function(p){return p!==user.uid});return((c.data.participantNames||{})[oid]||'').toLowerCase().indexOf(q)!==-1}):convs)}
        function renderConvList(list){var c=$('#sidebarList');if(!list.length){c.innerHTML='<div style="padding:2rem;text-align:center;color:var(--t3)"><span class="iconify" data-icon="ph:chat-circle" data-width="38"></span><p style="font-size:0.85rem;margin-top:0.5rem">No conversations</p></div>';return}var h='';list.forEach(function(cv){var oid=cv.data.participants.find(function(p){return p!==user.uid}),oname=(cv.data.participantNames||{})[oid]||'User',isBl=blocked.indexOf(oid)!==-1,unread=cv.data.unreadCount||0;h+='<div class="sidebar-i'+(activeUid===oid?' active':'')+'" onclick="openChat(\''+oid+'\')"><div class="sidebar-a" style="background:'+uColor(oname)+'">'+(oname||'U')[0].toUpperCase()+'</div><div class="sidebar-info"><div class="sidebar-name">'+esc(oname)+(isBl?' <span style="color:var(--da);font-size:0.58rem">(muted)</span>':'')+'</div><div class="sidebar-prev">'+(isBl?'Muted':esc(cv.data.lastMessage||'No messages'))+'</div></div><div class="sidebar-meta"><div class="sidebar-time">'+timeAgo(cv.data.lastMessageAt)+'</div>'+(unread>0&&!isBl?'<div class="sidebar-badge">'+(unread>9?'9+':unread)+'</div>':'')+'</div></div>'});c.innerHTML=h;window.Iconify.scan(c)}

        async function loadFollowing(){if(!user)return;var d=await db.collection('users').doc(user.uid).get();if(d.exists)user.followingList=d.data().following||[]}
        function isFollowing(uid){return user&&user.followingList&&user.followingList.indexOf(uid)!==-1}

        async function openChat(uid){if(!user||!uid||activeUid===uid)return;if(listener){listener();listener=null}activeUid=uid;var ds=await db.collection('users').doc(uid).get();activeUser=ds.exists?ds.data():{username:'User',uid:uid};activeUser.uid=uid;var following=isFollowing(uid),isBl=blocked.indexOf(uid)!==-1;renderActive(following,isBl);if(following&&!isBl)listenMessages();if(following)markRead();renderConvList(convs);cancelReply();setTimeout(function(){var w=$('#messagesArea');if(w){w.scrollTop=w.scrollHeight;isUserScrolling=false;$('#scrollBtn').classList.remove('show');}},100);if(window.innerWidth<=768){$('#sidebar').classList.add('hidden');$('#main').classList.remove('hidden');$('#backBtn').style.display='flex'}}

        function renderActive(following,isBl){$('#placeholder').style.display='none';$('#activeChat').style.display='flex';var a=$('#chatAvatar');a.style.background=activeUser.accentColor||uColor(activeUser.username||'User');a.textContent=(activeUser.emoji||(activeUser.username||'U')[0].toUpperCase());$('#chatName').textContent=activeUser.username||'User';$('#chatUser').textContent='@'+(activeUser.username||'user');$('#profileBtn').onclick=function(){window.open('profile.html?uid='+activeUid,'_self')};$('#muteBtn').onclick=toggleMute;$('#muteBtn').innerHTML=isBl?'<span class="iconify" data-icon="ph:prohibit-inset" data-width="15" style="color:var(--da)"></span>':'<span class="iconify" data-icon="ph:prohibit" data-width="15"></span>';$('#msgInput').value='';$('#sendBtn').disabled=true;if(!following){$('#inputBar').style.display='none';$('#messagesArea').innerHTML='<div class="placeholder"><div class="placeholder-icon"><span class="iconify" data-icon="ph:user-plus" data-width="38"></span></div><h3>Follow to chat</h3><p>Follow @'+(activeUser.username||'user')+' to send messages.</p><button class="btn btn-primary btn-sm" onclick="followAndChat()"><span class="iconify" data-icon="ph:user-plus" data-width="13"></span> Follow & Chat</button></div>'}else if(isBl){$('#inputBar').style.display='none';$('#messagesArea').innerHTML='<div class="placeholder"><div class="placeholder-icon"><span class="iconify" data-icon="ph:prohibit" data-width="38"></span></div><h3>Muted</h3><p>You muted @'+(activeUser.username||'user')+'.</p><button class="btn btn-outline btn-sm" onclick="toggleMute()">Unmute</button></div>'}else{$('#inputBar').style.display='flex';$('#messagesArea').innerHTML='';window.Iconify&&window.Iconify.scan(document.body)}}

        async function followAndChat(){if(!user||!activeUid)return;var meRef=db.collection('users').doc(user.uid),meDoc=await meRef.get();var mf=meDoc.exists?meDoc.data().following||[]:[];if(mf.indexOf(activeUid)===-1)mf.push(activeUid);await meRef.update({following:mf});var tRef=db.collection('users').doc(activeUid),tDoc=await tRef.get();var tf=tDoc.exists?tDoc.data().followers||[]:[];if(tf.indexOf(user.uid)===-1)tf.push(user.uid);await tRef.update({followers:tf});if(!user.followingList)user.followingList=[];user.followingList.push(activeUid);toast('Now following!');renderActive(true,blocked.indexOf(activeUid)!==-1);if(blocked.indexOf(activeUid)===-1)listenMessages()}

        async function toggleMute(){if(!user||!activeUid)return;var idx=blocked.indexOf(activeUid);if(idx!==-1){blocked.splice(idx,1);await db.collection('users').doc(user.uid).collection('blocked').doc(activeUid).delete();toast('Unmuted')}else{blocked.push(activeUid);await db.collection('users').doc(user.uid).collection('blocked').doc(activeUid).set({blockedAt:Date.now()});toast('Muted');if(listener){listener();listener=null}}renderActive(true,blocked.indexOf(activeUid)!==-1);renderConvList(convs)}

        function listenMessages(){if(blocked.indexOf(activeUid)!==-1)return;var cid=[user.uid,activeUid].sort().join('_');listener=db.collection('messages').doc(cid).collection('messages').orderBy('timestamp','asc').onSnapshot(function(snap){var msgs=[];snap.docChanges().forEach(function(change){if(change.type==='added'&&change.doc.data().senderId!==user.uid){var sound=new Audio();sound.src='https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3';sound.volume=0.3;sound.play().catch(function(){})}});snap.docs.forEach(function(d){var m=d.data();m.id=d.id;msgs.push(m)});renderMessages(msgs);})}

        function renderMessages(msgs){var c=$('#messagesArea');if(!c||c.querySelector('.placeholder'))return;var wasAtBottom=c.scrollHeight-c.scrollTop-c.clientHeight<80;var h='',lastDate='';msgs.forEach(function(m){var date=fdate(m.timestamp);if(date!==lastDate){h+='<div class="msg-date"><span>'+date+'</span></div>';lastDate=date}var isSent=m.senderId===user.uid;var text=esc(m.text);var urlMatch=text.match(/(https?:\/\/[^\s]+)/);if(urlMatch){var url=urlMatch[1];var domain='';try{domain=new URL(url).hostname.replace('www.','')}catch(e){}text=text.replace(url,'<a href="'+url+'" target="_blank" class="link">'+domain+'</a>')}var rp=m.replyTo?'<div class="reply-prev" onclick="scrollToMessage(\''+m.replyTo.id+'\')">↳ '+esc((m.replyTo.text||'').substring(0,50))+'</div>':'';h+='<div class="msg-row '+(isSent?'sent':'received')+'" data-msg-id="'+m.id+'"><div class="msg-actions">'+(isSent?'<button class="msg-act" title="Edit" onclick="openEditModal(\''+m.id+'\',\''+esc(m.text)+'\')"><span class="iconify" data-icon="ph:pencil-simple" data-width="12"></span></button><button class="msg-act" title="Delete" onclick="deleteMsg(\''+m.id+'\')"><span class="iconify" data-icon="ph:trash" data-width="12"></span></button>':'')+'<button class="msg-act" title="Reply" onclick="startReply(\''+m.id+'\',\''+esc((m.text||'').substring(0,35))+'\',\''+esc(m.senderName||'User')+'\')"><span class="iconify" data-icon="ph:arrow-bend-up-left" data-width="12"></span></button></div>'+rp+'<div class="bubble '+(isSent?'sent':'received')+(m.edited?' edited':'')+'"><span>'+text+'</span>'+(m.edited?'<div style="font-size:0.48rem;opacity:0.5;margin-top:0.08rem;text-align:right">edited</div>':'')+'<div class="b-time">'+ftime(m.timestamp)+'</div></div></div>'});c.innerHTML=h;window.Iconify.scan(c);if(wasAtBottom||!isUserScrolling){c.scrollTop=c.scrollHeight;$('#scrollBtn').classList.remove('show');}else{checkScroll()}}

        window.scrollToMessage=function(msgId){var el=document.querySelector('.msg-row[data-msg-id="'+msgId+'"]');if(el){el.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(function(){el.style.background='var(--pl)';setTimeout(function(){el.style.background=''},1000)},100)}}

        async function sendMessage(){var text=$('#msgInput').value.trim();if(!text||!activeUid||!user)return;if(blocked.indexOf(activeUid)!==-1){toast('Unmute to send','error');return}var cid=[user.uid,activeUid].sort().join('_');var msg={senderId:user.uid,text:text,timestamp:Date.now(),senderName:user.username||'User'};if(replying){msg.replyTo={id:replying.id,text:replying.text,sender:replying.sender};cancelReply()}await ensureConv(cid,activeUid,activeUser.username||'User',user.username||'User');await db.collection('messages').doc(cid).collection('messages').add(msg);var pn={};pn[user.uid]=user.username||'User';pn[activeUid]=activeUser.username||'User';await db.collection('messages').doc(cid).set({participants:[user.uid,activeUid],participantNames:pn,lastMessage:text,lastMessageAt:Date.now(),unreadCount:firebase.firestore.FieldValue.increment(1)},{merge:true});$('#msgInput').value='';$('#sendBtn').disabled=true;$('#msgInput').style.height='auto';loadConvs();setTimeout(function(){var w=$('#messagesArea');if(w)w.scrollTop=w.scrollHeight},80)}

        async function markRead(){if(!activeUid||!user)return;var cid=[user.uid,activeUid].sort().join('_');var ref=db.collection('messages').doc(cid);var ds=await ref.get();if(ds.exists)await ref.update({unreadCount:0});loadConvs()}
        function backToConvs(){$('#sidebar').classList.remove('hidden');$('#main').classList.add('hidden');$('#activeChat').style.display='none';$('#placeholder').style.display='flex';if(listener){listener();listener=null}activeUid=null;activeUser=null;isUserScrolling=false}
        function viewProfile(){if(activeUid)window.open('profile.html?uid='+activeUid,'_self')}

        auth.onAuthStateChanged(async function(u){
            if(u){var d=await db.collection('users').doc(u.uid).get();user=d.exists?Object.assign({uid:u.uid},d.data()):{uid:u.uid,username:u.email.split('@')[0],accentColor:uColor(u.email.split('@')[0]),emoji:'👤'};await loadFollowing()}else{window.location.href='index.html';return}
            loadConvs();var target=new URLSearchParams(location.search).get('uid');if(target&&target!==user.uid)openChat(target);
        });

        document.addEventListener('DOMContentLoaded',function(){
            var t=localStorage.getItem('ls-theme')||'light';setTheme(t);
            $('#themeToggle').onclick=function(){setTheme(document.body.className.indexOf('dark')!==-1?'light':'dark')};
            $('#backBtn').onclick=backToConvs;
            $('#emojiToggle').onclick=function(e){e.stopPropagation();$('#emojiPicker').classList.toggle('show');$('#linkPicker').classList.remove('show')};
            $('#linkToggle').onclick=function(e){e.stopPropagation();openLinkPicker();$('#emojiPicker').classList.remove('show')};
            document.addEventListener('click',function(e){if(!e.target.closest('#emojiPicker')&&!e.target.closest('#emojiToggle'))$('#emojiPicker').classList.remove('show');if(!e.target.closest('#linkPicker')&&!e.target.closest('#linkToggle'))$('#linkPicker').classList.remove('show')});
            renderEmojis();
            var msgArea=$('#messagesArea');if(msgArea)msgArea.addEventListener('scroll',function(){checkScroll();if(scrollTimeout)clearTimeout(scrollTimeout);scrollTimeout=setTimeout(function(){isUserScrolling=false;},500)});
            $('#saveEdit').onclick=saveEdit;$('#cancelEdit').onclick=closeEditModal;
            $('#editModal').addEventListener('click',function(e){if(e.target===$('#editModal'))closeEditModal()});
            if(window.innerWidth<=768){$('#backBtn').style.display='flex'}
            window.addEventListener('resize',function(){if(window.innerWidth<=768){$('#backBtn').style.display='flex'}else{$('#backBtn').style.display='none';$('#sidebar').classList.remove('hidden');$('#main').classList.remove('hidden')}});
        });
    </script>
</body>
</html>
